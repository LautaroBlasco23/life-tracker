server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers every container via the Docker socket and tails its json-file
  # logs. The API's structured JSON lines are parsed at query time with
  # LogQL's `| json`, so no label extraction is needed here.
  - job_name: lifetracker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(.+)"
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "(.+)"
        target_label: project
    pipeline_stages:
      # Docker's json-file driver wraps each line as {"log": "...", "stream": "...", "time": "..."}.
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
          location: UTC
      - labels:
          stream:
      - output:
          source: log
