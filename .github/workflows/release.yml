name: Release Please

# PR-oriented release flow: after each merge to main, release-please
# inspects conventional commits since the last release, opens (or updates)
# a "chore(main): release X.Y.Z" PR that bumps package.json files, mobile
# app.json and CHANGELOG.md. Merging that release PR creates the vX.Y.Z
# tag + GitHub Release, which triggers the Docker build/push workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # GITHUB_TOKEN-created tags/releases never trigger other workflows
          # (tag-push Docker builds would silently not run). Use a PAT stored
          # in RELEASE_PAT when present; falls back to GITHUB_TOKEN otherwise.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
