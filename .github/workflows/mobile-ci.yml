name: Mobile CI

on:
  push:
    # Exclude merge-queue staging branches: the merge_group trigger below
    # covers them; without this, queue builds would run push CI in duplicate.
    branches: [main, "!gh-readonly-queue/**"]
    paths: ["apps/mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    # No paths filter — see frontend-ci.yml.
    branches: [main]
  merge_group:
    # Merge queue builds: report the same required checks on the queue's
    # integration branch. Required by the main-branch ruleset.
    types: [checks_requested]
    branches: [main]

# Least privilege: this job only reads code and never needs write scopes.
permissions:
  contents: read

jobs:
  # Path scoping: see backend-ci.yml "changes" job for the rationale.
  changes:
    name: Detect affected paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            mobile:
              - "apps/mobile/**"
              - ".github/workflows/mobile-ci.yml"

  kotlin-build:
    name: kotlin-build
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build + unit tests (all modules)
        working-directory: apps/mobile
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest test

      # Coverage floor gate (Phase 6 ratchet): Jacoco aggregate over all
      # modules, floored on the LOGIC layer only (domain + core:network) —
      # Compose UI (feature/*, :app, designsystem) is disproportionately
      # expensive to test and deliberately outside the floor. Floors start
      # just below the measured baseline (Nov 2026: 52.05%) and only move up.
      # Compose view models wiring test deps is the next ratchet step.
      - name: Coverage floor gate (logic layer)
        working-directory: apps/mobile
        run: |
          ./gradlew jacocoTestReport --console=plain
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse('build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml')
          logic_prefixes = ('com/lifetracker/domain', 'com/lifetracker/core/network')
          missed = covered = 0
          for pkg in tree.getroot().iter('package'):
              if pkg.get('name', '').startswith(logic_prefixes):
                  for counter in pkg.findall('counter'):
                      if counter.get('type') == 'LINE':
                          missed += int(counter.get('missed'))
                          covered += int(counter.get('covered'))

          total = missed + covered
          if total == 0:
              print('No logic-layer coverage found in the Jacoco report', file=sys.stderr)
              sys.exit(1)
          pct = 100.0 * covered / total
          floor = 50.0
          print(f'Mobile logic-layer line coverage: {pct:.2f}% ({covered}/{total})')
          if pct < floor:
              print(f'Below the {floor}% floor (ratchet: floors only move up)', file=sys.stderr)
              sys.exit(1)
          PY
