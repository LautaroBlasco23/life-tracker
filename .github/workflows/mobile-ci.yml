name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    # No paths filter — see frontend-ci.yml.
    branches: [main]

# Least privilege: this job only reads code and never needs write scopes.
permissions:
  contents: read

jobs:
  kotlin-build:
    name: kotlin-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build + unit tests (all modules)
        working-directory: apps/mobile
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest test
