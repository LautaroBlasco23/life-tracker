name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/shared/**", "scripts/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    # No paths filter — see frontend-ci.yml.
    branches: [main]

# Least privilege: these jobs only read code and never need write scopes.
permissions:
  contents: read

jobs:
  type-check-and-export:
    name: type-check-and-export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # Root workspace install covers apps/mobile + packages/shared.
      # frontend/ is intentionally NOT a workspace (self-contained npm ci).
      - name: Install dependencies
        run: npm install

      - name: Type-check
        working-directory: apps/mobile
        run: npm run type-check

      - name: Unit tests (jest-expo)
        working-directory: apps/mobile
        run: npm test

      - name: Shared package tests (vitest)
        run: npm test -w @life-tracker/shared

      # Supply-chain gate: fail on known high/critical vulns in the
      # production dependency tree. Wraps `npm audit` with an allowlist
      # (see scripts/audit-prod.mjs for the rationale — --omit=dev is
      # unreliable at a workspace root, and several RN/Expo advisories
      # have no fixed release yet).
      - name: Dependency audit (npm audit)
        run: node scripts/audit-prod.mjs

      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android
