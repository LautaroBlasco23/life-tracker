name: Backend CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "nginx/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]

# Least privilege: these jobs only read code and never need write scopes.
permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lifetracker-backend
  # Must match backend/go.mod and the golang image in backend/Dockerfile.
  GO_VERSION: "1.26.9"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install tools
        run: make -C .. install-tools

      - name: Lint (golangci-lint)
        run: golangci-lint run ./...

      # Known-vulnerability gate against the module graph (stdlib too).
      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      # Integration suite against the compose test DBs (backend/.env.test:
      # :5433/:27018, isolated volumes/network — see the db-test-* make
      # targets). Coverage variant (report-only): runs the same tests with
      # -coverprofile and prints the total.
      - name: Run tests (with coverage)
        run: make -C .. test-coverage

      # Report-only coverage gate: publish the total to the run summary and
      # keep the raw profile as a short-lived artifact. Thresholds (if any)
      # are ratcheted later against the test-coverage baseline.
      - name: Publish coverage summary
        if: always()
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "Backend coverage total: ${total}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

      # Essential E2E suite (Go build tag `e2e`, backend/tests/e2e). Runs
      # against the same compose test DBs.
      - name: Essential E2E suite (build tag e2e)
        run: make -C .. test-e2e

  # k6 smoke lane against the load-test stack's compose API (no Prometheus
  # required: REMOTE_WRITE=0). smoke.js registers its own fresh, uniquely-named
  # user (LOADTEST_PREFIX defaults to smoke<timestamp>) so no user pool
  # provisioning is needed. Thresholds (p95<5000ms, failure rate<0.1) make k6
  # exit non-zero on breach, gating the PR. Heavier k6 lanes (read/write/auth/
  # mixed/features) run nightly instead — see nightly-loadtest.yml.
  api-perf-smoke:
    needs: test
    runs-on: ubuntu-latest
    # Same default as the test job: its `make -C ..` recipes resolve to the
    # repo root.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Self-contained stack: loadtest-api + pinned-credential DBs (own
      # volumes) + node-exporter/prometheus/grafana. Independent of .env —
      # except the Grafana admin password guard, so ensure .env exists
      # (idempotent; creates it from .env.example when missing).
      - name: Ensure .env exists
        run: make -C .. setup

      - name: Start load-test stack
        run: make -C .. loadtest-stack-up

      # Wait for the API to actually serve; the container start can return
      # before the service is up, which would make the smoke flaky.
      - name: Wait for API /health
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://localhost:8080/health" | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          echo "api /health not ready" >&2
          exit 1

      # --network host: k6 in the container targets localhost:8080 (the api
      # port published to the host). No docker.sock mount needed — the smoke
      # lane only makes HTTP requests to the deployed api.
      - name: Run k6 smoke against the api
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/loadtest:/scripts -w /scripts \
            -e LOADTEST_BASE_URL=http://localhost:8080 \
            grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34 run smoke.js

      - name: Stop load-test stack
        if: always()
        run: make -C .. loadtest-stack-down

  # Docker image is published only for real versions: vX.Y.Z tags cut by
  # release-please (see release.yml). Tags: X.Y.Z, X.Y and latest.
  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Upload endpoint files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: endpoint-files
          path: backend/endpoints/
          retention-days: 7
