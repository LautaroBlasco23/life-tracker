name: Backend CI

on:
  push:
    branches: ["main"]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lifetracker-backend
  GO_VERSION: "1.24"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install tools
        run: make -C .. install-tools

      - name: Start floci
        run: |
          docker network create golang_api_network 2>/dev/null || true
          docker run -d --name floci \
            --network golang_api_network \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -u root \
            -e FLOCI_HOSTNAME=floci \
            -e FLOCI_STORAGE_MODE=memory \
            floci/floci:1.6.0-compat

      - name: Provision AWS services on floci
        timeout-minutes: 10
        run: make -C .. floci-provision

      - name: Run tests against floci
        run: |
          set -a
          source .floci.env
          set +a
          ENVIRONMENT=test gotestsum --format=short-verbose -- -race -p 1 ./...

      - name: Deploy Lambda + API Gateway
        run: make -C .. floci-deploy

      - name: Smoke test Lambda endpoint
        run: |
          # floci quirk: use the stage-qualified execute-api path
          curl -sf "http://localhost:4566/execute-api/lifetracker-api/dev/health" \
            | grep -q '"status":"ok"'

  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Upload endpoint files
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-files
          path: backend/endpoints/
          retention-days: 7
