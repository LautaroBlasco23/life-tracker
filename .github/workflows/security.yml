# Secret scanning: block anything that looks like a committed credential.
# Runs on every PR and every push to main (full history on the first run).
#
# backend/.env.test is allowlisted in .gitleaks.toml (tracked test fixtures
# with throwaway values only — keep real credentials out of it regardless).
name: Secret scan (gitleaks)

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: detection only, no write scopes needed.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — scan the full history, not just the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
