name: Frontend CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - "packages/shared/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/shared/**"
      - ".github/workflows/frontend-ci.yml"

env:
  DOCKER_IMAGE: lautaroblasco1998/lifetracker-frontend
  REGISTRY: docker.io

jobs:
  # Fast quality gate for PRs: prettier formatting and TypeScript types.
  # Both are required status checks on main.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting (prettier)
        working-directory: frontend
        run: npx prettier --check .

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npm run lint:ts

  # Docker images are published only for real versions: vX.Y.Z tags cut by
  # release-please (see release.yml). Regular main pushes run build-export only.
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Smoke-test the pushed image: static export served by nginx on :3000,
  # runtime env injection, deep-link fallback, and the /api proxy upstream
  # rendered from the GATEWAY_UPSTREAM template.
  # NOTE: the frontend :latest image now only changes on version tags; the
  # checked-out ref is the tag, so :latest is the just-pushed release image.
  smoke:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Smoke-test pushed image
        run: |
          IMAGE="lautaroblasco1998/lifetracker-frontend:latest"
          docker pull "$IMAGE"
          docker run -d --name fe-smoke "$IMAGE"
          sleep 2

          curl --retry 5 --retry-connrefused -fsS http://localhost:3000/ >/dev/null

          # deep links: /notes 301s to /notes/ (directory redirect), so -L
          curl -fsSL http://localhost:3000/notes >/dev/null
          curl -fsSL http://localhost:3000/finance/ >/dev/null

          # runtime env injection
          curl -fsS http://localhost:3000/env-config.js \
            | grep -q "NEXT_PUBLIC_API_URL: '/api'"

          # /api proxy upstream rendered from GATEWAY_UPSTREAM
          docker exec fe-smoke \
            grep -q "proxy_pass http://api-gateway:8080;" \
            /etc/nginx/conf.d/default.conf

          docker rm -f fe-smoke >/dev/null

  # Static export build: validates `next build` (output: 'export' -> out/).
  # A floci S3 deploy smoke test is intentionally skipped here (optional per
  # refactor plan Phase 7); the backend job already exercises floci end-to-end.
  build-export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Verify export output
        working-directory: frontend
        run: test -f out/index.html
