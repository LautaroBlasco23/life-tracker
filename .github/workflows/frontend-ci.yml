name: Frontend CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - "packages/shared/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    # No paths filter: every PR must report this workflow's required checks
    # (the merge ruleset blocks on unreported contexts — a path-filtered
    # workflow would leave them "waiting for status to be reported").
    branches: [main]

# Least privilege: these jobs only read code and never need write scopes.
permissions:
  contents: read

env:
  DOCKER_IMAGE: lautaroblasco1998/lifetracker-frontend
  REGISTRY: docker.io

jobs:
  # Fast quality gate for PRs: prettier formatting and TypeScript types.
  # Both are required status checks on main.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting (prettier)
        working-directory: frontend
        run: npx prettier --check .

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

      # Coverage is report-only for now (decision: ratchet gate added later).
      # test:coverage re-runs the suite instrumented; totals go to the job
      # summary, the html report to an artifact.
      - name: Coverage report (vitest, report-only)
        working-directory: frontend
        run: |
          npm run test:coverage 2>&1 | tee coverage.log
          grep -E "All files" coverage.log | head -1 >> "$GITHUB_STEP_SUMMARY" || true
          rm -f coverage.log

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npm run lint:ts

      # Supply-chain gate: fail on known high/critical vulns in the
      # production dependency tree. Wraps `npm audit` with an allowlist
      # (see scripts/audit-prod.mjs for the rationale).
      - name: Dependency audit (npm audit)
        working-directory: frontend
        run: node scripts/audit-prod.mjs

  # Docker images are published only for real versions: vX.Y.Z tags cut by
  # release-please (see release.yml). Regular main pushes run build-export only.
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Smoke-test the pushed image: static export served by nginx on :3000,
  # runtime env injection, deep-link fallback, and the /api proxy upstream
  # rendered from the GATEWAY_UPSTREAM template.
  # NOTE: the frontend :latest image now only changes on version tags; the
  # checked-out ref is the tag, so :latest is the just-pushed release image.
  smoke:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Smoke-test pushed image
        run: |
          IMAGE="lautaroblasco1998/lifetracker-frontend:latest"
          docker pull "$IMAGE"
          # serve on :3000 inside the container (EXPOSE 3000); publish it so
          # curl can reach it from the runner
          docker run -d -p 3000:3000 --name fe-smoke "$IMAGE"
          sleep 2

          curl --retry 5 --retry-connrefused -fsS http://localhost:3000/ >/dev/null

          # deep links: /notes 301s to /notes/ (directory redirect), so -L
          curl -fsSL http://localhost:3000/notes >/dev/null
          curl -fsSL http://localhost:3000/finance/ >/dev/null

          # runtime env injection
          curl -fsS http://localhost:3000/env-config.js \
            | grep -q "NEXT_PUBLIC_API_URL: '/api'"

          # /api proxy upstream rendered from GATEWAY_UPSTREAM (indirected via
          # the nginx variable so boot survives a down gateway)
          docker exec fe-smoke \
            grep -q 'gateway_upstream api-gateway:8080;' \
            /etc/nginx/conf.d/default.conf

          docker rm -f fe-smoke >/dev/null

  # Static export build: validates `next build` (output: 'export' -> out/).
  # A deploy smoke test is intentionally skipped here; the e2e job already
  # exercises the full container lane end-to-end.
  build-export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Verify export output
        working-directory: frontend
        run: test -f out/index.html

  # Essential E2E (Playwright, chromium only — see playwright.config.ts):
  # spins up the full-stack container lane (`make dev-container`: postgres +
  # mongodb + api + nginx static export with the /api proxy on :3000) and runs
  # the critical-path specs. Essential-only policy — deeper E2E is follow-up
  # work (same split as the k6 loadtest: PR smoke lane, nightly full suite).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # dev-container's compose file reads .env (or .env.example); setup
      # creates it idempotently from .env.example (dev defaults, no secrets).
      # The backend rejects placeholder JWT_SECRET/DB_PASSWORD at boot
      # (config.Validate, by design), so generate ephemeral CI-only values —
      # otherwise the api container crash-loops and the health check below
      # never connects (this is why e2e was permanently red).
      - name: Prepare env file
        run: |
          make setup
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env

      # Builds the api image, starts postgres + mongodb + api, runs
      # migrations, then builds the static export and serves it via nginx
      # (deploy-frontend.sh writes out/env-config.js with NEXT_PUBLIC_API_URL
      # = same-origin /api, exactly like the deploy lane).
      - name: Start full-stack lane
        run: make dev-container

      # Probe inside the compose network first: it proves the api actually
      # serves, regardless of how the runner's dockerd publishes ports.
      - name: Wait for API health
        run: |
          docker run --rm --network infra_golang_api_network alpine sh -c '
            for i in $(seq 1 30); do
              wget -q -O /dev/null http://api:8080/health && exit 0
              sleep 2
            done
            echo "api did not become healthy on the compose network" >&2
            exit 1
          '
          # Then the host-published port (Playwright relies on host loopback
          # reachability for :3000).
          curl --retry 30 --retry-connrefused --retry-delay 2 -fsS http://localhost:8080/health

      - name: Wait for frontend
        run: curl --retry 30 --retry-connrefused --retry-delay 2 -fsS http://localhost:3000/env-config.js

      # Listener-state sampling while e2e runs: if Chromium reports
      # ERR_CONNECTION_REFUSED again, this proves whether :3000 stopped
      # being LISTENed (port-binding churn) or stayed up.
      - name: e2e (with listener-state sampling)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          sudo apt-get install -y -q tcpdump > /dev/null
          (
            for i in $(seq 1 360); do
              ss -tln | grep -qE ':(3000)\b' || echo "$(date -u +%T) :3000 MISSING"
              sleep 0.5
            done
          ) > /tmp/port3000-sample.log 2>&1 &
          SAMPLER_PID=$!
          sudo tcpdump -i any -n "tcp port 3000" -c 8000 -w /tmp/p3000.pcap &
          TCPDUMP_PID=$!
          npm run test:e2e
          TEST_RC=$?
          kill "$SAMPLER_PID" 2>/dev/null || true
          sudo kill "$TCPDUMP_PID" 2>/dev/null || true
          if [ -s /tmp/port3000-sample.log ]; then
            echo "=== :3000 listener gaps during e2e ===" >&2
            cat /tmp/port3000-sample.log >&2
          fi
          echo "=== packet capture (:3000, first 200 + last 100 packets) ===" >&2
          sudo tcpdump -r /tmp/p3000.pcap -n 2>/dev/null > /tmp/p3000.txt || true
          head -200 /tmp/p3000.txt >&2
          tail -100 /tmp/p3000.txt >&2
          exit "$TEST_RC"


      # The lane produces no logs otherwise — without this, a container
      # crash-loop or restart is invisible (a failed step just times out).
      # Must stay BELOW the e2e run: it only fires on prior-step failure.
      - name: Diagnose lane (on failure)
        if: failure()
        run: |
          docker ps -a
          docker inspect -f '{{.Name}} restarts={{.RestartCount}} status={{.State.Status}}' golang_api_server lifetracker-web || true
          docker logs golang_api_server --tail 100 || true
          docker logs lifetracker-web --tail 50 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
