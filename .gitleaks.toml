# gitleaks configuration: upstream default rules plus repo-specific
# allowlists. Local runs: `gitleaks detect --source . --config .gitleaks.toml`.
[extend]
# Use gitleaks' built-in rule set as the base.
useDefault = true

[allowlist]
description = "Known non-secrets in this repository"
paths = [
    # Tracked test fixtures with throwaway values (local docker-compose test
    # defaults). Real credentials must never be added to this file.
    '''backend/\.env\.test$''',
    # Placeholder env templates (your-password / your-secret-key-here, etc.)
    '''\.env\.example$''',
    # Postman collection with empty token placeholders.
    '''backend/postman/.*\.json$''',
    # Endpoint-contract examples: fake JWT/refresh tokens cut off with "…"
    # (never real credentials — see the docs source of truth rule).
    '''docs/backend\.md$''',
]
