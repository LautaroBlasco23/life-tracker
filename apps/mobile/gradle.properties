org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP registers its generated kotlin sources via the kotlin.sourceSets DSL,
# which AGP 9's built-in-Kotlin guard initially rejects: allow it.
android.disallowKotlinSourceSets=false
# AGP 8.10.1 officially tops out at compileSdk 36; 37 is available on this SDK

kotlin.code.style=official
android.suppressUnsupportedCompileSdk=37
