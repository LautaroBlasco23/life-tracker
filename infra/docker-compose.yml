services:
  # AWS emulator — only started by the emulator/full lanes (make dev-emulator,
  # make up). Plain `make dev` runs the API as a container instead.
  floci:
    image: floci/floci:1.6.0-compat
    container_name: floci
    restart: unless-stopped
    profiles: ["emulator"]
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
    user: root
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
    networks:
      - golang_api_network

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: golang_api_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../backend/.env
    # .env keeps localhost hosts (host-run backend needs them); override
    # with compose service names for the container network. Mirrors the
    # docker-compose.loadtest.yml api overrides.
    environment:
      DB_HOST: postgres
      MONGO_URI: "" # empty -> config falls back to building from MONGO_HOST
      MONGO_HOST: mongodb
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - golang_api_network

  postgres:
    image: postgres:15-alpine
    container_name: golang_api_postgres
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - golang_api_network

  mongodb:
    image: mongo:7.0
    container_name: golang_api_mongodb
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - golang_api_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: golang_api_node_exporter
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - golang_api_network

  prometheus:
    image: prom/prometheus:latest
    container_name: golang_api_prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      # accept k6 remote-write (live load-test metrics)
      - "--web.enable-remote-write-receiver"
      # native histograms for k6 trend metrics (k6 Prometheus dashboards)
      - "--enable-feature=native-histograms"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ../backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
    networks:
      - golang_api_network

  grafana:
    image: grafana/grafana:latest
    container_name: golang_api_grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3001/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - golang_api_network

  loki:
    image: grafana/loki:3.3.2
    container_name: golang_api_loki
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ../backend/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - golang_api_network

  promtail:
    image: grafana/promtail:3.3.2
    container_name: golang_api_promtail
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ../backend/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - golang_api_network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  floci_data:
    driver: local

networks:
  golang_api_network:
    driver: bridge
