# Load-test variant of nginx.conf: proxies /api directly to the compose `api`
# container (Go backend on :8080) instead of the floci API Gateway.
#
# Activated only via docker-compose.frontend.override.yml. The emulator stack
# (make dev-emulator / nginx.conf) keeps the floci gateway upstream untouched.
#
# Mounted at /etc/nginx/conf.d/default.conf. The `api` service is reachable on
# the shared golang_api_network by its compose service name.
server {
    listen 80;
    server_name _;

    # Baseline security headers (see nginx.conf for the HSTS note).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # Same rationale as nginx.conf: the lane publishes the container's :80 on
    # a nonstandard host port (:3000), so absolute directory redirects would
    # drop the published port (http://localhost/login/ on :80 → refused in
    # e2e). Relative redirects work on every host port.
    absolute_redirect off;

    location /api/ {
        # /api/<rest> -> http://api:8080/api/<rest> (matches the Gin /api group)
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
