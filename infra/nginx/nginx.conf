# Dev web server: serves the Next.js static export AND proxies /api to the
# floci API Gateway on the same origin (http://localhost:3000), so the browser
# never sends a cross-origin preflight. floci's gateway answers OPTIONS itself
# without CORS headers, so cross-origin calls from the browser would fail.
server {
    listen 80;
    server_name _;

    # Baseline security headers. HSTS is omitted on purpose: this dev server
    # answers plain HTTP — enable "Strict-Transport-Security: max-age=31536000;
    # includeSubDomains" at the TLS termination layer in production.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # Directory redirects (/login -> /login/) must NOT bake in the container's
    # internal port (80). With absolute_redirect on (default), nginx emits
    # `Location: http://host/login/` without the published port, so browsers
    # follow to port 80 and get ECONNREFUSED whenever the lane runs on a
    # nonstandard port (compose web = :3000, CI e2e lane). Relative redirects
    # work on every port.
    absolute_redirect off;

    location /api/ {
        # /api/<rest> -> /execute-api/lifetracker-api/dev/api/<rest>
        proxy_pass http://floci:4566/execute-api/lifetracker-api/dev/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
