# Dev web server: serves the Next.js static export AND proxies /api to the
# floci API Gateway on the same origin (http://localhost:3000), so the browser
# never sends a cross-origin preflight. floci's gateway answers OPTIONS itself
# without CORS headers, so cross-origin calls from the browser would fail.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # /api/<rest> -> /execute-api/lifetracker-api/dev/api/<rest>
        proxy_pass http://floci:4566/execute-api/lifetracker-api/dev/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
