# Load-testing override: point the nginx /api proxy at the direct compose API
# container (golang_api_server :8080) instead of the floci gateway.
#
# Use with the base frontend compose:
#   docker compose -f docker-compose.frontend.yml -f docker-compose.frontend.override.yml up -d
#
# Compose merges volume mounts by target path, so this replaces the base
# nginx.conf with nginx.api.conf for the web container only. The emulator stack
# (make dev-emulator, which proxies /api to the gateway) is unaffected.
services:
  web:
    volumes:
      - ./nginx/nginx.api.conf:/etc/nginx/conf.d/default.conf:ro
