# Frontend serving.
#
# The Next.js export uses root-relative asset paths (/ _next/...), so it must be
# served at the domain root. In real AWS a CloudFront distribution fronts the S3
# bucket at a root domain; floci's CloudFront data-plane has parity gaps, so the
# local equivalent is an nginx container serving the build output on port 3000.
# S3 stays the deploy artifact (see scripts/deploy-frontend.sh).
#
# nginx also proxies /api to the floci API Gateway on the same origin. floci's
# gateway does not answer CORS preflights, so cross-origin browser calls fail;
# same-origin via this proxy avoids preflights entirely.
#
# The build output lives in a named volume (populated by deploy-frontend.sh via
# docker cp) rather than a host bind mount: `next build` deletes and recreates
# out/, which breaks host bind mounts under Docker Desktop's WSL integration.

services:
  web:
    image: nginx:alpine
    container_name: lifetracker-web
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - web_data:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - golang_api_network

volumes:
  web_data:
    name: lifetracker-web-data

networks:
  # Share the backend network so nginx can proxy to the floci container by name.
  golang_api_network:
    external: true
    name: infra_golang_api_network
