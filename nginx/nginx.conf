# Web server: serves the Next.js static export AND proxies /api to the
# compose `api` container (Go backend on :8080) on the same origin, so the
# browser never sends a cross-origin preflight. The API is reachable on the
# compose network by its service name.
# Mounted at /etc/nginx/conf.d/default.conf (see the `web` service in
# docker-compose.yml).
server {
    listen 80;
    server_name _;

    # Baseline security headers (see nginx.conf for the HSTS note).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # Same rationale as nginx.conf: the lane publishes the container's :80 on
    # a nonstandard host port (:3000), so absolute directory redirects would
    # drop the published port (http://localhost/login/ on :80 → refused in
    # e2e). Relative redirects work on every host port.
    absolute_redirect off;

    location /api/ {
        # /api/<rest> -> http://api:8080/api/<rest> (matches the Gin /api group)
        # Resolver + variable (like the frontend image's template): a static
        # proxy_pass hostname resolves once at nginx startup, so recreating
        # the api container (new IP) would 502 until the web restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        # nginx defaults to 1MB and would 413 image uploads; the backend caps
        # them at 10MB (global MAX_BODY_BYTES default 40MB), so allow headroom.
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin image proxy for the dev S3 lane (official AWS Emulator):
    # the emulator enforces real-S3 Fetch Metadata semantics, which reject
    # browser-initiated anonymous fetches that are not same-origin — so
    # hotlinking the emulator's :9297 TLS endpoint from the app can never
    # load an image. The lane's embedded image URLs therefore point here
    # (backend S3_PUBLIC_URL = this origin), and this location forwards them
    # to the s3-pipe TLS bridge, which re-encrypts toward the emulator.
    # Variable + resolver (not a static proxy_pass hostname) so nginx boots
    # even when the aws-emulator profile is not running; requests only fail
    # if they actually reference a down emulator.
    location /lifetracker-images/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $s3_images_upstream s3-pipe:9297;
        proxy_pass http://$s3_images_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
