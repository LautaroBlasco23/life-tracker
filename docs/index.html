<script id="docs-data" type="application/json">{"getting-started":{"title":"Getting Started","md":"Life Tracker is a personal life-tracking platform — habits & activities, routines, reminders, notes, finances, time tracking, screen time, and a social layer — shipped as a set of apps over one Go API.\n\n## The project at a glance\n\n| App | What it is | Tech | More |\n|---|---|---|---|\n| Backend API | The REST API every client talks to | Go (Gin), PostgreSQL + MongoDB, JWT | [backend.md](./backend.md) |\n| Web frontend | Browser app | Next.js 14 (static export), Tailwind v4, shadcn/ui | [frontend.md](./frontend.md) |\n| Mobile (Android) | Native app | Expo / React Native, expo-router, NativeWind | [mobile.md](./mobile.md) |\n| Shared packages | Business logic, services, types, i18n — reused by web + mobile | TypeScript (`packages/shared`) | — |\n\nEach app is self-contained; its doc covers the setup details. For how the pieces fit together (compose services, request flow, deployment), see [Architecture](./architecture.md).\n\n## Fast start\n\n```bash\nmake setup   # copies .env.example → .env (repo root)\nmake dev     # databases in Docker + API (:8080) + web app (:3000), hot-reloading\nmake stop    # tear everything down\n```\n\nOpen `http://localhost:3000` (API at `http://localhost:8080/api`). This is the daily loop: air and `next dev` pick up changes live, so re-running `make dev` doubles as the restart command.\n\n## Run modes\n\nRun modes from the repository root (one at a time; `make stop` stops whichever is running):\n\n| Command | Mode | What runs | URLs |\n|---|---|---|---|\n| `make dev` | Fast lane (host) | air hot-reload on the host (`:8080`) + postgres + mongodb in compose + `next dev` (`:3000`). No app containers, no observability. | API `:8080/api`, app `:3000` |\n| `make dev-container` | Container | API container + postgres + mongodb + frontend (nginx proxies `/api` → `:8080`). No observability. | API `:8080/api`, app `:3000` |\n| `make dev-full` | Container + observability | Same as `make dev-container` plus Prometheus, Grafana, Loki, Promtail, node-exporter. | + Prometheus `:9090`, Grafana `:3001`, Loki `:3100` |\n| `make mobile` | Mobile dev loop | Android emulator (Windows) + API (`:8080`) + Metro (`:8081`) + app launch; `[R]` rebuilds the native app. | app on emulator, API `:8080/api` |\n\nAll of them are idempotent — re-running a mode's command redeploys the backend and frontend with the latest code, so it doubles as the restart command (`make dev` needs no restart at all: air and `next dev` pick up changes live). See [Deployment Modes](./deployment-modes.md) for the full description of each mode, and [mobile.md](./mobile.md) for the mobile loop.\n\n- `make stop` tears down everything (`docker compose down` with every profile passed, so it removes every running service of the project, including observability and the frontend container). For the mobile loop, `make mobile-stop` stops what `make mobile` started (API + Metro).\n- **Setup**: `make setup` copies `.env.example` → `.env` (root). **`GRAFANA_ADMIN_PASSWORD` is mandatory for the observability stack** (`dev-full`) — compose fails loudly if unset; `.env.example` includes the key.\n- **Tests**: `make test` (all unit suites: shared · web · mobile · backend),\n  `make test-backend-e2e` / `make test-web-e2e` (E2E lanes), `make loadtest`\n  — the full command list via `make tests`, details in\n  [tests.md](./tests.md) and [loadtest.md](./loadtest.md).\n- **Backend**: [`backend.md`](./backend.md) — `make backend-dev` runs the API with databases (air hot reload).\n- **Infrastructure**: the root `Makefile` (`make help`) owns every docker compose command. Compose file: `docker-compose.yml` at the repo root (api + postgres + mongodb + web; the observability and load-test stacks are compose *profiles* — `observability` and `loadtest` — so the plain `up` never starts them). nginx configs in `nginx/`, deploy/migrate scripts in `scripts/`.\n- **Frontend**: [`frontend.md`](./frontend.md) — install dependencies and run the Next.js dev server. The static export is served at `http://localhost:3000` via `make frontend-up` (nginx, `/api` proxied same-origin to the API container) and rebuilt into the web volume via `make deploy-frontend` (the `make dev-container` / `dev-full` lanes do this automatically)."},"architecture":{"title":"Architecture","md":"The application is a single docker compose stack defined at the repo root in\n[`docker-compose.yml`](../docker-compose.yml): the Go API, PostgreSQL, MongoDB,\nand an nginx container serving the Next.js static export. Deployment is plain\n`docker compose up -d` — no cloud provider, no emulator, no orchestration layer.\n\n## Services\n\n| Service | Container | Role |\n|---|---|---|\n| `api` | `golang_api_server` (:8080) | The REST API (Gin, prod-built image from `backend/Dockerfile`); runs its embedded migrations on every (re)start |\n| `web` | `lifetracker-web` (:3000) | nginx serving the static Next.js export from a named volume; proxies `/api/*` to the api container on the same origin |\n| `postgres` | `golang_api_postgres` (:5432, loopback) | Relational data: users, auth, activities, reminders, notes, time, routines, social |\n| `mongodb` | `golang_api_mongodb` (:27017, loopback) | Document data: activity records, transactions, payments, screen time |\n\nCompose *profiles* (never started by a plain `docker compose up -d`):\n\n- `observability` — node-exporter, Prometheus (:9090), Grafana (:3001), Loki (:3100), Promtail. Prometheus scrapes the API's `/metrics` endpoint and node-exporter; Promtail ships container logs into Loki. Prometheus/Grafana/Loki publish on `127.0.0.1` only — access from outside the box needs an SSH tunnel.\n- `loadtest` — `loadtest-api` + `loadtest-postgres` + `loadtest-mongodb`: the same API and databases with pinned credentials and their own volumes, so the load-test lane works regardless of `.env` and never touches dev DB data (see [`loadtest.md`](./loadtest.md)). Note `loadtest-api` publishes `:8080` on all interfaces (dev DBs are loopback-only).\n\nTest databases reuse the same `postgres`/`mongodb` definitions with different env values (`backend/.env.test`: :5433/:27018, `_test` volumes, separate network) — see the `db-test-*` make targets.\n\nThe compose project name is pinned to `infra` in the compose file, which keeps the historical volume/network names (`infra_postgres_data`, `infra_golang_api_network`, …) — no data migration when the stack moved from `infra/` to the repo root.\n\n## Request flow\n\n```\nBrowser\n  │\n  ▼  http://localhost:3000\nnginx (lifetracker-web) ── serves the Next.js static export\n  │\n  └─ /api/*  →  api:8080/api/*   (same-origin proxy, no CORS preflights)\n                 │\n                 ▼\n              PostgreSQL + MongoDB\n              (on the compose network)\n\nMobile app\n  └─ direct to http://\u003chost>:8080/api  (bypass nginx)\n```\n\nThe nginx proxy keeps API calls same-origin for the browser. The Next.js export uses root-relative asset paths (`/_next/...`), so it must be served at the domain root — nginx on :3000 does exactly that, with the runtime API URL injected via `/env-config.js` (see [`frontend.md`](./frontend.md)).\n\n## Deployment & migrations\n\n- `docker compose up -d --build` (or `make dev-container`) — build + start everything.\n- `scripts/deploy-frontend.sh` — `next build` (static export), bakes the runtime `env-config.js`, and copies the output into the nginx volume. The build output lives in a named volume rather than a host bind mount because `next build` deletes and recreates `out/`, which breaks host bind mounts under Docker Desktop's WSL integration.\n- `scripts/migrate.sh` — executes the migrate binary inside a container attached to the compose network (host-side tools cannot always reach bridge IPs, e.g. Docker Desktop WSL2). The API container also runs its embedded migrations on every start, so this is the explicit standalone equivalent.\n- `nginx/nginx.tls.conf.example` — template for host-side TLS termination (certbot) when deploying beyond localhost; the in-stack nginx stays plain HTTP.\n\n_Diagrams authored in Excalidraw._"},"backend":{"title":"Backend","md":"Go (Gin) REST API for the Life Tracker platform: authentication, user profiles, habits & activities, reminders, finances, notes & note groups, time tracking, routines, social, screen time, and full-account data export/import.\n\nThis doc covers the backend **logic only** — business rules and the HTTP API. For how the app is built, deployed, and run (container stack), see [architecture.md](./architecture.md) and [deployment-modes.md](./deployment-modes.md). For run commands, see [getting-started.md](./getting-started.md). For the data model (what is stored and how it relates), see [data-schemas.md](./data-schemas.md).\n\n---\n\n## Architecture\n\nDomain-driven structure: each domain is self-contained with its own controller, service, repository, model, DTOs, and routes. The HTTP layer (controller) depends on the business layer (service), which depends on the data layer (repository). Models map to storage: **GORM structs for PostgreSQL** and **BSON structs for MongoDB**.\n\n```\ninternal/\n├── domain/{domain}/\n│   ├── controller/   ← HTTP handlers (parse requests, map DTOs)\n│   ├── service/      ← business logic\n│   ├── repository/   ← data access (GORM / mongo-driver)\n│   ├── model/        ← DB structs + domain enums\n│   ├── dto/          ← request/response types\n│   └── routes/       ← route registration\n├── config/           ← env-based configuration\n├── database/         ← connections + versioned SQL migrations\n├── infrastructure/   ← cross-cutting: image storage (S3), secrets (incl. AWS Secrets\n│                        Manager for the prod JWT secret), pagination, monitoring\n└── middleware/       ← JWT auth, CORS, timezone, rate limiting, body limits,\n                        security headers, recovery, request ID, request logging, metrics\n```\n\n**Storage split**\n\n| Storage | Domains | Why |\n|---|---|---|\n| PostgreSQL (GORM) | auth (+ refresh tokens), user, activity, reminder, note, note-group, time, routine, social | Relational, relational queries (follows, subscriptions, ownership) |\n| MongoDB (mongo-driver) | activity records, finance (transactions/payments) | Document data, write-heavy time-series-like records |\n\nMigrations are versioned SQL files under `internal/database/migrations/` (naming convention `{6-digit-number}_{description}.{up|down}.sql`).\n\n---\n\n## Tech Stack\n\n- **Go** (Gin HTTP framework)\n- **GORM** — PostgreSQL ORM\n- **mongo-driver** — MongoDB client\n- **JWT** — access & refresh token auth\n- **bcrypt** — password hashing\n- **godotenv** — env file loading\n- **golang-migrate** — embedded versioned SQL migrations (run on every API start)\n- **excelize** — Excel export/import (`data` domain)\n- **AWS SDK** — S3 image storage + Secrets Manager (prod JWT secret; LocalStack emulator in dev via `AWS_ENDPOINT_URL`)\n- **prometheus client_golang** — `/metrics`\n\n---\n\n## Domain Modules\n\nEach domain below shows its main resource as JSON — one representative request + response. The examples are illustrative (optional fields may be omitted); the full shapes live in the domain DTOs (`internal/domain/\u003cdomain>/dto/`), and the data model is documented in [data-schemas.md](./data-schemas.md).\n\n### Auth — `domain/auth`\n\nCredentials live in the `auth` table; profiles in the `user` table (1:1 via `userId`).\n\n**Refresh tokens** are also stored **server-side** (`refresh_tokens` table, SHA-256 hashed) so sessions are revocable: password or email change invalidates existing sessions.\n\n**Example** — `POST /auth/register` request:\n\n```json\n{\n  \"email\": \"ada@example.com\",\n  \"password\": \"correct-horse-battery\",\n  \"firstName\": \"Ada\",\n  \"lastName\": \"Lovelace\",\n  \"username\": \"ada\"\n}\n```\n\nRegister, login, and refresh all return a token pair:\n\n```json\n{\n  \"accessToken\": \"eyJhbGciOiJIUzI1NiIs...\",\n  \"refreshToken\": \"b7c1d9f04e2a...\",\n  \"tokenType\": \"Bearer\",\n  \"expiresIn\": 900\n}\n```\n\n**Logic**\n- `POST register` — validates uniqueness (email/username), hashes password (bcrypt), creates auth + user records, returns token pair.\n- `POST login` — verifies credentials (by email **or** username via `identifier`), returns **access token** (short-lived JWT) + **refresh token** (persisted server-side).\n- `POST refresh` — validates the refresh token and issues a new token pair (rotation).\n- `POST logout` — revokes the server-side refresh token.\n- `PUT password` / `PUT email` — protected; email change re-issues tokens and revokes old sessions. Tokens embed `userId`, `email`, and expiry.\n\n### User — `domain/user`\n\n**Example** — `GET /users/me` response:\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"ada\",\n  \"firstName\": \"Ada\",\n  \"lastName\": \"Lovelace\",\n  \"email\": \"ada@example.com\",\n  \"profilePicUrl\": \"https://cdn.example.com/ada.jpg\",\n  \"thumbnailUrl\": \"https://cdn.example.com/ada-sm.jpg\",\n  \"timezone\": \"America/Argentina/Buenos_Aires\",\n  \"profilePrivacyStatus\": \"public\",\n  \"createdAt\": \"2026-01-10T09:00:00Z\",\n  \"updatedAt\": \"2026-01-15T10:30:00Z\"\n}\n```\n\n**Logic**\n- Profile CRUD, username update with format validation + availability check.\n- Profile image upload/delete — stored via the image store (S3) with thumbnail generation.\n- Username/email availability checks used by the frontend during registration.\n- Prefix search over users (public profile cards).\n\n### Activity (Habits) — `domain/activity`\n\nActivity definitions live in PostgreSQL; **completion records in MongoDB**.\n\n**Example** — `POST /activities` request:\n\n```json\n{\n  \"title\": \"Morning stretch\",\n  \"description\": \"10 minutes of mobility work\",\n  \"frequency\": \"weekly\",\n  \"dayFrequency\": \"mon,wed,fri\",\n  \"dayTime\": \"morning\",\n  \"completionAmount\": 1\n}\n```\n\nResponse (with `GET /activities/:id/stats` adding the streak/records block):\n\n```json\n{\n  \"id\": 7,\n  \"userId\": 1,\n  \"title\": \"Morning stretch\",\n  \"description\": \"10 minutes of mobility work\",\n  \"frequency\": \"weekly\",\n  \"dayFrequency\": \"mon,wed,fri\",\n  \"dayTime\": \"morning\",\n  \"completionAmount\": 1,\n  \"privacyStatus\": \"private\",\n  \"isActive\": true,\n  \"todayCompletions\": 1,\n  \"isCompletedToday\": true,\n  \"streak\": { \"current\": 12, \"longest\": 21 },\n  \"routines\": [{ \"id\": 3, \"title\": \"Morning routine\" }]\n}\n```\n\n`todayCompletions`, `isCompletedToday`, `streak`, and `routines` are computed, not stored — see [data-schemas.md](./data-schemas.md#activity-habits).\n\nRecording a completion — `POST /activities/:id/record` (`completionDate` optional, defaults to now):\n\n```json\n{ \"completionDate\": \"2026-01-15T08:30:00Z\", \"notes\": \"felt great\" }\n```\n\n```json\n{\n  \"id\": \"68f0c1a2e4b0a1b2c3d4e5f6\",\n  \"activityId\": 7,\n  \"userId\": 1,\n  \"completionDate\": \"2026-01-15T08:30:00Z\",\n  \"notes\": \"felt great\",\n  \"createdAt\": \"2026-01-15T08:30:00Z\"\n}\n```\n\n**Logic**\n- CRUD with a dynamic update map (only provided fields change).\n- **Record completion** — idempotency per day handled by `completionAmount`; `todayCompletions` and `isCompletedToday` are computed from the records.\n- **Scheduling** — `shouldShowToday` decides if an activity is due today based on frequency, day frequency, and time-of-day.\n- **Streaks** — `CalculateStreak` computes current + longest streak and completion rate, with separate algorithms for daily / weekly / monthly frequencies.\n- **Stats** — total completions, current/longest streak, completion rate, recent records.\n- **Revert** — removes the last completion (optionally for a target date).\n- Public activities can be listed for other users (used by social subscriptions).\n\n### Reminder — `domain/reminder`\n\nOne-time events with a deadline. In Postgres (`reminders` table).\n\n**Example** — `POST /reminders` request:\n\n```json\n{\n  \"title\": \"Renew passport\",\n  \"description\": \"Book the appointment\",\n  \"dueAt\": \"2026-02-01T12:00:00Z\",\n  \"activeFrom\": \"2026-01-20T00:00:00Z\"\n}\n```\n\nResponse (adds the server-set fields):\n\n```json\n{\n  \"id\": 5,\n  \"userId\": 1,\n  \"title\": \"Renew passport\",\n  \"description\": \"Book the appointment\",\n  \"dueAt\": \"2026-02-01T12:00:00Z\",\n  \"activeFrom\": \"2026-01-20T00:00:00Z\",\n  \"completedAt\": null,\n  \"privacyStatus\": \"private\"\n}\n```\n\n**Logic**\n- Status is derived client-side (`getReminderStatus`): `locked` (before `activeFrom`) → `active` → `missed` (past `dueAt`) / `completed`.\n- Creating/updating enforces `active_from` before `due_at`.\n- Complete/revert only set/clear `completed_at`.\n\n### Finance — `domain/finance`\n\nAll finance data lives in MongoDB. Categories are a fixed built-in catalog.\n\n**Built-in categories** (12) — income: `Primary Income`, `Side Income`, `Investments`, `Other Income`; outcome: `Housing & Utilities`, `Food & Groceries`, `Transportation`, `Health & Fitness`, `Education`, `Entertainment & Travel`, `Taxes & Fees`, `Pets & Misc`. Each has a type (`income`/`outcome`) and applies to a frequency (`fixed`/`variable`).\n\n**Example** — `POST /finances/transactions` (variable transaction) request:\n\n```json\n{\n  \"type\": \"outcome\",\n  \"frequency\": \"variable\",\n  \"amount\": 42.5,\n  \"category\": \"Food & Groceries\",\n  \"description\": \"Weekly groceries\",\n  \"date\": \"2026-01-15T12:00:00Z\"\n}\n```\n\nResponse:\n\n```json\n{\n  \"id\": \"68f0c1a2e4b0a1b2c3d4e5f7\",\n  \"type\": \"outcome\",\n  \"frequency\": \"variable\",\n  \"amount\": 42.5,\n  \"categoryName\": \"Food & Groceries\",\n  \"description\": \"Weekly groceries\",\n  \"date\": \"2026-01-15T12:00:00Z\"\n}\n```\n\nRecording a payment for a fixed transaction — `POST /finances/payments`:\n\n```json\n{ \"transactionId\": \"68f0b9e2e4b0a1b2c3d4e5f1\", \"amount\": 850, \"date\": \"2026-01-05T10:00:00Z\" }\n```\n\nThe movements feed (`GET /finances/movements`) merges variable transactions, fixed payments, and pending fixed bills into one list:\n\n```json\n{\n  \"id\": \"68f0b9e2e4b0a1b2c3d4e5f2\",\n  \"sourceType\": \"payment\",\n  \"type\": \"outcome\",\n  \"amount\": 850,\n  \"category\": \"Housing & Utilities\",\n  \"date\": \"2026-01-05T10:00:00Z\",\n  \"paid\": true,\n  \"transactionId\": \"68f0b9e2e4b0a1b2c3d4e5f1\"\n}\n```\n\n**Logic**\n- **Transactions** — variable transactions are single events; fixed transactions are templates that accrue payments over time.\n- **Period bucketing** — `GetPeriodKey` maps a payment date to its period key (`YYYY-MM` for monthly, `YYYY-MM` of the 2-month block for bimonthly, `YYYY` for yearly), used to determine whether the current period is paid.\n- **Fixed transaction view** — returns the fixed template plus `totalPaid`, the payment list, and the current-period payment.\n- **Movements feed** — paginated, filterable list (type, category, date range, month/year).\n- **Summary** — totals by category and type over a date range.\n- **Monthly stats** — per-month aggregates for a year.\n\n### Note — `domain/note`\n\n**Example** — `POST /notes` request:\n\n```json\n{ \"title\": \"Book ideas\", \"content\": \"## To read\\n- The Pragmatic Programmer\" }\n```\n\nResponse:\n\n```json\n{\n  \"id\": 4,\n  \"userId\": 1,\n  \"title\": \"Book ideas\",\n  \"content\": \"## To read\\n- The Pragmatic Programmer\",\n  \"groupId\": 2,\n  \"position\": 3\n}\n```\n\nManual ordering — `POST /notes/reorder`:\n\n```json\n{\n  \"items\": [\n    { \"id\": 4, \"groupId\": 2, \"position\": 0 },\n    { \"id\": 5, \"groupId\": null, \"position\": 1 }\n  ]\n}\n```\n\n**Logic**\n\nCRUD + filtering (title/content search), plus `POST /notes/reorder` for manual ordering.\n\n### Note Group — `domain/note-group`\n\nNotes can be grouped. Full CRUD over `note_groups` (`id`, `userId`, `name`, `position`), plus `POST /note-groups/reorder`:\n\n```json\n{\n  \"items\": [\n    { \"id\": 2, \"position\": 0 },\n    { \"id\": 1, \"position\": 1 }\n  ]\n}\n```\n\n### Time — `domain/time`\n\n**Example** — `POST /time-records` request:\n\n```json\n{ \"category\": \"Deep work\", \"description\": \"Docs refactor\", \"durationMinutes\": 90 }\n```\n\nResponse:\n\n```json\n{\n  \"id\": 9,\n  \"category\": \"Deep work\",\n  \"description\": \"Docs refactor\",\n  \"durationMinutes\": 90,\n  \"createdAt\": \"2026-01-15T14:00:00Z\",\n  \"updatedAt\": \"2026-01-15T14:00:00Z\"\n}\n```\n\n**Logic**\n\nCRUD with filter support, plus `GET /stats` aggregating total time per category.\n\n### Calendar — `domain/calendar`\n\n**Schema** (`calendar_events` table): `id`, `userId`, `title` (max 255),\n`description`, `category` (max 100), `start_at`, `end_at`, plus the\nrecurrence columns `series_id`, `occurrence_index`, `recurrence_rule`,\n`recurrence_until`, `recurrence_interval` (all nullable — one-off events\nkeep them NULL).\n\nScheduled time blocks for the week calendar (the `Calendar` tab of the web\nTime page). Unlike `time_records` — logged facts with only a duration — events\ncarry an explicit start and end and may be in the future.\n\nRules:\n\n- `end_at` must be after `start_at`; an event may not exceed 24 hours.\n- `GET` with a range keeps events that **overlap** `[from, to)`, so a block\n  crossing midnight or a week boundary appears in both views.\n- `from` and `to` are RFC3339 instants and must be sent together.\n\n**Weekly recurrence**\n\nA recurring event is **materialized**: creating one writes one row per\noccurrence (same weekday and time of day), all of them sharing a `series_id`\nand carrying their `occurrence_index`. The read path is unchanged — every\noccurrence is an ordinary event, so the overlap query and the week grid need\nno special casing.\n\n- `POST /calendar-events` accepts an optional `recurrence` object:\n  `{ \"rule\": \"weekly\", \"interval\": 1, \"until\": \"\u003cRFC3339>\" }`.\n  `until` is **required** for a weekly rule; `interval` is the number of\n  weeks between occurrences (default 1, max 52).\n- An occurrence is created while its start is **before or at** `until`; a\n  series can hold at most **100 occurrences**. A longer series is rejected\n  with a 400 error instead of being truncated.\n- Updating or deleting an event that belongs to a series takes a `scope`:\n  - `PUT /calendar-events/:id` — `scope` in the body (`occurrence`, the\n    default, or `series`).\n  - `DELETE /calendar-events/:id?scope=series` — `scope` as a query\n    parameter (the repo convention for flags).\n  - `scope=series` applies the change to every occurrence: a new start shifts\n    the whole series by the same amount and the edited occurrence's new\n    duration is applied to all of them. `scope=series` on an event that is\n    not part of a series behaves like `scope=occurrence`.\n- The occurrences are anchored to the **user's timezone** (the `X-Timezone`\n  header the clients send on every request), so a 10:00 class stays at 10:00\n  after a daylight-saving change: the step is applied on the wall clock in\n  that location, not by adding 7×24h to the instant.\n- A series is written in a single transaction, so a failure never leaves a\n  partial series behind.\n\nLimitation: the rule is materialized at creation time, so a series cannot be\nturned into a single event (or the other way round) later, and the weekday\nand time of day of the series are fixed by its first occurrence.\n\n### Routine — `domain/routine`\n\n**Example** — `POST /routines` request (ordered activity references):\n\n```json\n{\n  \"title\": \"Morning routine\",\n  \"description\": \"Start the day right\",\n  \"privacyStatus\": \"private\",\n  \"dayTime\": \"morning\",\n  \"dayFrequency\": \"mon,tue,wed,thu,fri\",\n  \"activityIds\": [\n    { \"activityId\": 7, \"position\": 0 },\n    { \"activityId\": 9, \"position\": 1 }\n  ]\n}\n```\n\nResponse (activities expanded inline):\n\n```json\n{\n  \"id\": 3,\n  \"userId\": 1,\n  \"title\": \"Morning routine\",\n  \"description\": \"Start the day right\",\n  \"status\": \"active\",\n  \"privacyStatus\": \"private\",\n  \"dayTime\": \"morning\",\n  \"dayFrequency\": \"mon,tue,wed,thu,fri\",\n  \"activities\": [\n    {\n      \"activityId\": 7,\n      \"activityTitle\": \"Morning stretch\",\n      \"position\": 0,\n      \"todayCompletions\": 1,\n      \"scheduledToday\": true\n    }\n  ],\n  \"isCompletedToday\": false\n}\n```\n\n**Logic**\n- A routine is an ordered collection of the owner's activities.\n- Creation/update validates that all referenced activities belong to the user (`validateActivitiesOwnership`).\n- Public routines can be listed for other users.\n\n### Social — `domain/social`\n\n**Example** — subscribing to a public activity (`POST /subscriptions`):\n\n```json\n{ \"sourceType\": \"activity\", \"sourceId\": 7 }\n```\n\n```json\n{ \"id\": 12, \"sourceType\": \"activity\", \"sourceId\": 7, \"clonedId\": 15 }\n```\n\nPublic profile view (`GET /users/:username/profile`) — content is only populated when the viewer may see it:\n\n```json\n{\n  \"id\": 2,\n  \"username\": \"grace\",\n  \"firstName\": \"Grace\",\n  \"lastName\": \"Hopper\",\n  \"profilePrivacyStatus\": \"public\",\n  \"followStatus\": \"accepted\",\n  \"isFollowing\": true,\n  \"followersCount\": 18,\n  \"followingCount\": 4,\n  \"canViewContent\": true,\n  \"activities\": [\n    { \"id\": 7, \"title\": \"5k run\", \"frequency\": \"daily\", \"completionAmount\": 1, \"subscribed\": false }\n  ],\n  \"routines\": []\n}\n```\n\n**Logic**\n- **Follow system** — request/accept flow: follow creates a `pending` request (or `accepted` if the target profile is public), the owner accepts/rejects, and followers/following lists are paginated.\n- **Visibility** — `visibility.go` enforces profile/content privacy: private content is only visible to the owner or accepted followers.\n- **Subscriptions** — subscribe to another user's public activity or routine; the subscription clones the source into the subscriber's space (`clonedId`).\n\n### Data — `domain/data`\n\nFull-account backup: **Excel export/import** of the user's data (excelize), reading from PostgreSQL + MongoDB collections.\n\n- `GET /users/me/data/export` — produces an Excel workbook of all the user's records.\n- `POST /users/me/data/import` — imports an uploaded workbook (body capped by `MaxBodyBytes` config, ~32 MB).\n\nConsumed by both clients via the shared `data-service` (`packages/shared/src/services/`).\n\n### Data export/import — `domain/data`\n\nFull backup of one user as an XLSX workbook: `GET /users/me/data/export`\ndownloads it, `POST /users/me/data/import` (multipart field `file`) restores it.\n\n**Covered entities** — one sheet per entity, plus a `_meta` sheet with\n`schema_version`, `exported_at` and `user_id`:\n\n| Sheet | Store | Rows |\n|---|---|---|\n| `activities` | PostgreSQL | activities |\n| `time_records` | PostgreSQL | time records |\n| `calendar_events` | PostgreSQL | calendar events |\n| `notes` | PostgreSQL | notes |\n| `routines`, `routine_activities` | PostgreSQL | routines and their activity links |\n| `activity_records` | MongoDB | activity records |\n| `transactions`, `payments` | MongoDB | finance data |\n\nThe `calendar_events` sheet is generated from the calendar model, so every\ncolumn of the table is backed up (a column added to the model is exported\nwithout touching the backup code). Every cell is written as a string\n(ISO 8601 dates, ObjectID hex) to survive a round trip through Excel.\n\n**Import semantics**\n\n- **Destructive** — the user's current data is deleted and replaced with the\n  contents of the file.\n- **All or nothing** — the whole file is validated first; if a row breaks a\n  rule, the import is refused with a report and nothing is changed.\n- **Re-owned** — every restored row belongs to the importing user; the\n  archived `user_id` is ignored.\n- **Fresh ids** — calendar events are restored with new ids (the id sequence\n  is global, so an archived id could belong to another user's row); the\n  other entities keep their ids.\n- **Domain rules** — restored calendar events must have a title, an `end_at`\n  after `start_at` and a duration of at most 24 hours.\n\nThe workbook layout is versioned: `schema_version` is currently `2`; files of\nan older version are refused instead of being restored partially.\n\n---\n\n## API Reference\n\nAll routes are mounted under the `/api` prefix. \"Public\" routes need no token; \"Protected\" routes require `Authorization: Bearer \u003caccess_token>`.\n\n### Auth — `/api/auth`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /auth/register | Public | Create account, returns token pair |\n| POST | /auth/login | Public | Login, returns token pair |\n| POST | /auth/refresh | Public | Rotate refresh token |\n| POST | /auth/logout | Protected | Revoke the refresh token (session) |\n| PUT | /auth/password | Protected | Update password |\n| PUT | /auth/email | Protected | Update email, re-issues tokens |\n\n### User — `/api/users`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| GET | /users/me | Protected | Own profile |\n| PUT | /users/me | Protected | Update profile |\n| POST | /users/me/image | Protected | Upload profile image |\n| DELETE | /users/me/image | Protected | Delete profile image |\n| GET | /users | Protected | List users |\n| GET | /users/search?prefix= | Protected | Prefix search |\n| GET | /users/:username | Protected | Get profile by username |\n| GET | /users/check-username?username= | Public | Username availability (rate-limited) |\n| GET | /users/check-email?email= | Public | Email availability |\n\n### Activity — `/api/activities`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /activities | Protected | Create activity |\n| GET | /activities | Protected | List activities (optionally incl. inactive) |\n| GET | /activities/today | Protected | Activities due today |\n| GET | /activities/:id | Protected | Get activity |\n| PUT | /activities/:id | Protected | Update activity |\n| DELETE | /activities/:id | Protected | Delete activity |\n| POST | /activities/:id/record | Protected | Record a completion |\n| GET | /activities/:id/records | Protected | Completion history |\n| GET | /activities/:id/stats | Protected | Completions + streak stats |\n| DELETE | /activities/:id/revert | Protected | Revert last completion |\n\n**Extra:** `GET /activities/streak` — global streak across all the user's activities.\n\n### Reminder — `/api/reminders`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /reminders | Protected | Create reminder |\n| GET | /reminders | Protected | List reminders |\n| GET | /reminders/:id | Protected | Get reminder |\n| PUT | /reminders/:id | Protected | Update reminder |\n| DELETE | /reminders/:id | Protected | Delete reminder |\n| POST | /reminders/:id/complete | Protected | Mark completed |\n| DELETE | /reminders/:id/complete | Protected | Revert completion |\n\n### Finance — `/api/finances`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| GET | /finances/categories | Protected | Built-in categories (filterable by type/frequency) |\n| POST | /finances/transactions | Protected | Create transaction |\n| GET | /finances/transactions | Protected | List transactions (type/frequency/date/category filters) |\n| GET | /finances/transactions/:id | Protected | Get transaction |\n| PUT | /finances/transactions/:id | Protected | Update transaction |\n| DELETE | /finances/transactions/:id | Protected | Delete transaction |\n| GET | /finances/fixed-transactions | Protected | Fixed templates with payments for a period |\n| GET | /finances/fixed-transactions/:id | Protected | Fixed template detail |\n| GET | /finances/movements | Protected | Paginated movements feed |\n| POST | /finances/payments | Protected | Create payment for a fixed transaction |\n| GET | /finances/payments | Protected | List payments |\n| DELETE | /finances/payments/:id | Protected | Delete payment |\n| GET | /finances/summary | Protected | Totals by category over a date range |\n| GET | /finances/monthly-stats | Protected | Per-month aggregates for a year |\n\n### Note — `/api/notes`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /notes | Protected | Create note |\n| GET | /notes | Protected | List notes (filterable) |\n| GET | /notes/:id | Protected | Get note |\n| PUT | /notes/:id | Protected | Update note |\n| DELETE | /notes/:id | Protected | Delete note |\n| POST | /notes/reorder | Protected | Manual note ordering |\n\n### Note Group — `/api/note-groups`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /note-groups | Protected | Create group |\n| GET | /note-groups | Protected | List groups |\n| GET | /note-groups/:id | Protected | Get group |\n| PUT | /note-groups/:id | Protected | Update group |\n| DELETE | /note-groups/:id | Protected | Delete group |\n| POST | /note-groups/reorder | Protected | Manual group ordering |\n\n### Time — `/api/time-records`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /time-records | Protected | Create time record |\n| GET | /time-records | Protected | List records (filterable) |\n| GET | /time-records/stats | Protected | Total time per category |\n| GET | /time-records/:id | Protected | Get record |\n| PUT | /time-records/:id | Protected | Update record |\n| DELETE | /time-records/:id | Protected | Delete record |\n\n### Calendar — `/api/calendar-events`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /calendar-events | Protected | Create event (optional weekly `recurrence`) |\n| GET | /calendar-events?from=&to= | Protected | List events overlapping the range |\n| GET | /calendar-events/:id | Protected | Get event |\n| PUT | /calendar-events/:id | Protected | Update event (`scope` in the body) |\n| DELETE | /calendar-events/:id?scope= | Protected | Delete event (`scope=series` removes the series) |\n\n### Routine — `/api/routines`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /routines | Protected | Create routine |\n| GET | /routines/me | Protected | My routines |\n| GET | /routines/:id | Protected | Get routine |\n| PATCH | /routines/:id | Protected | Update routine |\n| DELETE | /routines/:id | Protected | Delete routine |\n\n### Social\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| POST | /follows/:username | Protected | Follow user |\n| DELETE | /follows/:username | Protected | Unfollow user |\n| GET | /follows/pending | Protected | Pending follow requests |\n| POST | /follows/pending/:followerId/accept | Protected | Accept request |\n| POST | /follows/pending/:followerId/reject | Protected | Reject request |\n| GET | /users/:username/followers | Protected | Follower list |\n| GET | /users/:username/following | Protected | Following list |\n| POST | /subscriptions | Protected | Subscribe to a public activity/routine |\n| GET | /subscriptions | Protected | My subscriptions |\n| DELETE | /subscriptions/:id | Protected | Unsubscribe |\n| GET | /users/:username/profile | Public | Public profile view |\n\n### Data — `/api/users/me/data`\n\n| Method | Path | Access | Description |\n|---|---|---|---|\n| GET | /data/export | Protected | Download the user's backup as XLSX |\n| POST | /data/import | Protected | Restore the user's data from an XLSX backup |\n\n### System\n\n| Method | Path | Description |\n|---|---|---|\n| GET | /health | Service health incl. PostgreSQL + MongoDB status |\n| GET | /metrics | Prometheus metrics |\n\nPostman collections for a subset of domains (activities, authentication, finances, health, routines, users) are available in `../backend/postman/`. CI uploads plain per-domain JSON endpoint files from `backend/endpoints/` as an artifact instead (see [ci-cd.md](./ci-cd.md)).\n\n---\n\n## License\n\nMIT — see `LICENSE`."},"data-schemas":{"title":"Data Schemas","md":"What the app stores and how the entities relate. Diagrams show **relationships only** — entities and their references; the JSON under each diagram carries the field-level detail. Shapes mirror the backend models (`backend/internal/domain/*/model/`) and the shared types in [`packages/shared/src/types/`](../packages/shared/src/types/). Storage split (what lives in PostgreSQL vs MongoDB) is in [backend.md](./backend.md#architecture).\n\nSections follow the same order as [backend.md](./backend.md), one per domain.\n\n## Auth & user\n\n```\n+-------------------+ 1     1 +-------------------------+\n|       User        |-------->|      Auth (pg)          |\n|    (pg: users)    |  userId |  email, username        |\n|  profile + privacy|         |  password_hash (bcrypt) |\n+-------------------+         +-------------------------+\n\n+-------------------------+\n|  RefreshToken (pg)      |\n|  userId, hashed token   |   server-side sessions → revocable\n+-------------------------+\n```\n\n```json\n{\n  \"id\": 1,\n  \"username\": \"ada\",\n  \"firstName\": \"Ada\",\n  \"lastName\": \"Lovelace\",\n  \"email\": \"ada@example.com\",\n  \"profilePicUrl\": \"https://cdn.example.com/ada.jpg\",\n  \"thumbnailUrl\": \"https://cdn.example.com/ada-sm.jpg\",\n  \"timezone\": \"America/Argentina/Buenos_Aires\",\n  \"profilePrivacyStatus\": \"public\"\n}\n```\n\n- `password_hash` is never serialized.\n- Refresh tokens are stored **hashed** (SHA-256) — password or email change invalidates existing sessions.\n- `profilePrivacyStatus` gates content visibility (see [social](#social)).\n\n## Activity (habits)\n\n```\n+-------------------------+ 1     * +---------------------------+\n|      Activity (pg)      |-------->|    ActivityRecord (Mongo) |\n|       id, userId        |activity |   activityId, userId      |\n|  definition + schedule  |   Id    |   completionDate, notes   |\n+-------------------------+         +---------------------------+\n```\n\n```json\n{\n  \"id\": 7,\n  \"userId\": 1,\n  \"title\": \"Morning stretch\",\n  \"description\": \"10 minutes of mobility work\",\n  \"frequency\": \"weekly\",\n  \"dayFrequency\": \"mon,wed,fri\",\n  \"dayTime\": \"morning\",\n  \"completionAmount\": 1,\n  \"privacyStatus\": \"private\",\n  \"isActive\": true\n}\n```\n\n```json\n{\n  \"id\": \"68f0c1a2e4b0a1b2c3d4e5f6\",\n  \"activityId\": 7,\n  \"userId\": 1,\n  \"completionDate\": \"2026-01-15T08:30:00Z\",\n  \"notes\": \"felt great\"\n}\n```\n\n- `frequency` is `daily` | `weekly` | `monthly` (one-time activities were removed in migration `000015`); `dayFrequency` names the weekdays for weekly; `dayTime` is `notSpecified` | `morning` | `afternoon` | `evening`.\n- `completionAmount` is how many completions count as \"done\" for one day.\n\n**How a completion works** — `POST /activities/:id/record` appends an `ActivityRecord` to Mongo. Everything the client sees on the activity is derived from those records, nothing extra is stored: `todayCompletions` counts today's records, `isCompletedToday` = `todayCompletions >= completionAmount`, and the streak is computed from the completion dates (separate algorithms per frequency).\n\n## Reminder\n\nOne-time events with a deadline (`reminders`, Postgres). Stored:\n\n```json\n{\n  \"id\": 5,\n  \"userId\": 1,\n  \"title\": \"Renew passport\",\n  \"description\": \"Book the appointment\",\n  \"dueAt\": \"2026-02-01T12:00:00Z\",\n  \"activeFrom\": \"2026-01-20T00:00:00Z\",\n  \"completedAt\": null,\n  \"privacyStatus\": \"private\"\n}\n```\n\n- Status is derived client-side: `locked` (before `activeFrom`) → `active` → `missed` (past `dueAt`) / `completed`. Only `completedAt` is ever written on completion.\n\n## Finance\n\nAll finance data lives in MongoDB. Categories are a fixed built-in catalog (12), not user data.\n\n```\n+-------------------------+          +----------------------------+\n|   Transaction (Mongo)   | category |   Category (built-in, 12)  |\n|      id, userId         |--------->|   type: income | outcome   |\n|   type, frequency       |          |   applicableToFreq?:       |\n+------------+------------+          |     fixed | variable       |\n             | 1                     +----------------------------+\n             | payments *\n             v\n+-------------------------+\n|     Payment (Mongo)     |\n|     transactionId       |\n|     amount, date        |\n+-------------------------+\n```\n\nVariable transaction (a single money event):\n\n```json\n{\n  \"id\": \"68f0c1a2e4b0a1b2c3d4e5f7\",\n  \"userId\": 1,\n  \"type\": \"outcome\",\n  \"frequency\": \"variable\",\n  \"amount\": 42.5,\n  \"categoryName\": \"Food & Groceries\",\n  \"description\": \"Weekly groceries\",\n  \"date\": \"2026-01-15T12:00:00Z\"\n}\n```\n\nPayment (a concrete payment attached to a fixed transaction):\n\n```json\n{\n  \"id\": \"68f0b9e2e4b0a1b2c3d4e5f2\",\n  \"transactionId\": \"68f0b9e2e4b0a1b2c3d4e5f1\",\n  \"amount\": 850,\n  \"date\": \"2026-01-05T10:00:00Z\"\n}\n```\n\n- `frequency` is `fixed` | `variable`; fixed transactions also carry `paymentFrequency` (`monthly` | `bimonthly` | `yearly`).\n\n**How a fixed transaction works** — a fixed transaction is a template (e.g. rent, monthly), not a money event. Each payment creates a `Payment` pointing at it. `GetPeriodKey` maps a payment date to its period (`YYYY-MM` monthly, the 2-month block for bimonthly, `YYYY` yearly); the current period counts as paid when a payment falls in it. Two API views are derived on read, not stored:\n\n- **FixedTransaction view** = template + `totalPaid` + `payments` + `currentPeriodPayment`.\n- **Movement (feed)** = merged list of variable transactions, fixed payments, and pending fixed bills (`paid: false`) for the current period.\n\n## Notes\n\n```\n+----------------------+ 1     * +------------------+\n|   NoteGroup (pg)     |-------->|    Note (pg)     |\n|  id, userId, name    | groupId?|  id, userId      |\n|  position            |         |  title, content  |\n+----------------------+         |  position        |\n                                 +------------------+\n```\n\n```json\n{\n  \"id\": 4,\n  \"userId\": 1,\n  \"title\": \"Book ideas\",\n  \"content\": \"## To read\\n- The Pragmatic Programmer\",\n  \"groupId\": 2,\n  \"position\": 3\n}\n```\n\n- `groupId` is optional — ungrouped notes have `null` and mix into the same manual ordering.\n- Both notes and groups are ordered by `position` (via `POST /notes/reorder` / `POST /note-groups/reorder`); moving a note in/out of a group is part of the same reorder payload.\n\n## Time\n\nFree-form time log (`time_records`, Postgres). No entity relationships — `category` is free text:\n\n```json\n{\n  \"id\": 9,\n  \"userId\": 1,\n  \"category\": \"Deep work\",\n  \"description\": \"Docs refactor\",\n  \"durationMinutes\": 90\n}\n```\n\n## Routine\n\n```\n+--------------------+ 1     * +---------------------------+ *     1 +------------+\n|    Routine (pg)    |-------->|    routine_activities     |------->| Activity   |\n|  id, userId        |routineId|  (routineId, activityId)  |activity|  (pg)      |\n|  status, dayTime   |         |  composite PK + position  |   Id   +------------+\n+--------------------+         +---------------------------+\n```\n\n```json\n{\n  \"id\": 3,\n  \"userId\": 1,\n  \"title\": \"Morning routine\",\n  \"description\": \"Start the day right\",\n  \"status\": \"active\",\n  \"privacyStatus\": \"private\",\n  \"dayTime\": \"morning\",\n  \"dayFrequency\": \"mon,tue,wed,thu,fri\",\n  \"activities\": [\n    { \"activityId\": 7, \"activityTitle\": \"Morning stretch\", \"position\": 0, \"scheduledToday\": true }\n  ],\n  \"isCompletedToday\": false\n}\n```\n\n- `status` is `draft` | `active` (default) | `stopped`.\n- The join table is ordered by `position`; creation/update validates all referenced activities belong to the user.\n- `isCompletedToday` is derived from its activities' completions.\n\n## Social\n\n```\n+------------+  follower   +----------------------+  followee   +------------+\n|    User    |------------>|     Follow (pg)      |------------>|    User    |\n+------------+             |  (followerId,        |             +------------+\n                           |   followeeId) PK     |\n                           |  status, acceptedAt? |\n                           +----------------------+\n\n+------------+  subscribes to    +--------------------------+  clones to\n+------------+                   |   Subscription (pg)      |   +--------------------+\n|    User    |------------------>|  subscriberUserId        |   |  own copy of the   |\n+------------+                   |  sourceType: activity |  |   |  source (clonedId) |\n                                 |              routine     |   +--------------------+\n                                 |  sourceId, clonedId      |\n                                 +--------------------------+\n```\n\n```json\n{\n  \"followerId\": 1,\n  \"followeeId\": 2,\n  \"status\": \"accepted\",\n  \"acceptedAt\": \"2026-01-12T18:00:00Z\"\n}\n```\n\n```json\n{\n  \"id\": 12,\n  \"subscriberUserId\": 1,\n  \"sourceUserId\": 2,\n  \"sourceType\": \"activity\",\n  \"sourceId\": 7,\n  \"clonedId\": 15\n}\n```\n\n**How following works** — following creates a `pending` request, or `accepted` directly when the target profile is public. The owner accepts/rejects pending requests. Visibility is enforced server-side (`visibility.go`): private content is visible only to the owner and accepted followers — the public profile shell (card + counts) is always returned, with `canViewContent` flagging whether the content lists are populated.\n\n**How subscriptions work** — subscribing to a public activity/routine **clones** it into the subscriber's space; `clonedId` points at the subscriber's own copy, so the source owner's edits don't propagate."},"frontend":{"title":"Frontend","md":"Web application for tracking personal activities, finances, spent time, notes and the user's profile.\nDeveloped initially with Vercel V0. Built with Next.js and TypeScript.\n\n![Next.js Version](https://img.shields.io/badge/Next.js-14-black?style=flat&logo=next.js)\n![TypeScript](https://img.shields.io/badge/TypeScript-5-blue?style=flat&logo=typescript)\n![License](https://img.shields.io/badge/license-MIT-blue.svg)\n\n---\n\n## Features\n\n- **Authentication**\n  - Secure user registration and login\n  - Protected routes with session management (refresh-token rotation)\n  - Persistent authentication state\n\n- **Activity Tracking**\n  - Create, edit, and delete activities\n  - Interactive progress tracking\n  - Target-based completion system\n  - Time-based categories (Morning, Afternoon, Night)\n  - Flexible frequency settings (Daily, Weekly with specific days)\n  - Streaks (`GET /activities/streak`)\n  - Visual progress indicators\n\n- **Reminders**\n  - One-time events shown as cards inside the Activities page (no separate route)\n  - Created via the shared activity form by checking \"Reminder\"\n  - Deadline with date picker and optional active window\n  - Status badges and countdowns (Overdue / Open now / Upcoming / Completed)\n  - Unified create/edit form defaults to a normal activity; the checkbox\n    switches it to reminder mode\n\n- **Time Tracking** (`/time`, two tabs)\n  - Records: live timer sessions and manual entries, per-category totals,\n    period + month/year/category filters\n  - Calendar: week grid (Monday start) for scheduled blocks. Click an empty\n    slot to create an event, click an event to edit or delete it; overlapping\n    events render side by side, and the current time is marked. Screens below\n    `md` show a single-day agenda with a day picker.\n  - Recurrence: the event form has a `Repeat` select (None / Weekly) and, for\n    a weekly event, the last date the series repeats on (up to 100\n    occurrences). Occurrences of a series are marked with a repeat icon and\n    can be edited or deleted alone or as a whole series.\n  - Overnight events: an explicit \"ends the next day\" toggle lets an event\n    end past midnight (the end time is never reinterpreted); the 24-hour\n    limit still applies.\n  - Mobile parity: the Expo app has the same two tabs (records / calendar);\n    the calendar shows a day picker + single-day agenda with the same form\n    (category, repeat, scope) reusing the shared calendar service.\n\n- **Finance Management**\n  - Dashboard + transactions views (tabs under `app/finance/`)\n  - Fully wired to the backend via the shared `finance-service`\n\n- **Time Tracking**\n  - Active session card (`app/time/`, `use-active-sessions`)\n  - Start/stop sessions and browse records\n\n- **Notes**\n  - Markdown notes (`components/notes/` incl. `markdown-view`)\n  - Note groups with manual reorder (`POST /notes/reorder`)\n\n- **Social & Users**\n  - `app/social/` follow/social feed\n  - `app/users/` user search and public profiles (`/user/[username]`)\n\n- **User Profile**\n  - Profile information management\n  - Avatar upload\n  - Theme preferences (System/Light/Dark via `ThemeContext`)\n  - Account settings\n\n- **Architecture & Quality**\n  - Type-safe development with TypeScript\n  - Component-driven architecture\n  - Reusable UI components with shadcn/ui\n  - Form validation with Zod schemas\n  - Responsive design\n  - i18n (EN/ES) via the shared `LanguageProvider` (`@shared`)\n  - Vitest unit tests + Playwright E2E (see [tests.md](./tests.md))\n\n---\n\n## Tech Stack\n\n- **Next.js 14** (App Router, `output: 'export'` static export) - React framework\n- **React 18**\n- **TypeScript** - Type-safe development\n- **Tailwind CSS v4** - Utility-first styling\n- **shadcn/ui + Radix UI** - Accessible component primitives\n- **React Hook Form + Zod** - Form handling and validation\n- **date-fns** - Date utilities\n- **Lucide React** - Icon library\n- **`@shared/*`** - Business logic, services, types and i18n from `packages/shared` (tsconfig path alias)\n- **Husky + lint-staged** - Prettier pre-commit gate\n\n---\n\n## Project Structure\n\n```text\nfrontend/\n├── app/                # Next.js App Router pages (feature folders: components/, modals/, hooks/, views/)\n├── components/         # Reusable React components (ui/ = shadcn primitives)\n├── contexts/           # React context providers (theme)\n├── hooks/              # Shared hooks\n├── lib/                # Utility functions\n├── e2e/                # Playwright specs + helpers\n├── test/               # Vitest setup\n├── scripts/            # Prod dependency audit (audit-prod.mjs)\n├── nginx-templates/    # nginx config templates for the runtime container\n├── inject-env.sh       # Runtime env injection (/env-config.js)\n├── Dockerfile          # Static export + nginx runtime image\n├── Dockerfile.dev      # Dev container image (hot reload)\n├── Dockerfile.export   # Export-stage image\n├── out/                # Static export (committed on purpose)\n└── package.json\n```\n\n> **Note:** there is no `frontend/services/`, `frontend/types/`, or\n> `frontend/Makefile`. Business logic lives in `packages/shared`; commands come\n> from the root Makefile. The frontend is deliberately outside the npm\n> workspaces — run `npm install` inside `frontend/` separately.\n\n---\n\n## Quick Start\n\n### Prerequisites\n\n- Node.js 22+\n- npm\n- Backend API running (see [backend.md](./backend.md))\n\n### Fastest Path (One Command)\n\n```bash\ngit clone \u003cyour-repo-url>\ncd life-tracker\nmake dev\n```\n\nApplication runs at `http://localhost:3000` with hot reload (backend air + `next dev`).\n\n> **Note:** This starts the fast lane: databases in Docker, backend and frontend on the host with hot reload. Use `make dev-container` for the full container-mode stack (API container + static export + nginx). See [getting-started.md](./getting-started.md) for the other run modes.\n\n### Standard Setup (More Control)\n\n```bash\n# 1. Clone and install dependencies\ngit clone \u003cyour-repo-url>\ncd frontend\nnpm install\n\n# 2. Setup environment (repo root; creates .env from .env.example)\ncd .. && make setup && cd frontend\n\n# 3. Start development server\nNEXT_PUBLIC_API_URL=http://localhost:8080/api npm run dev\n```\n\n### Environment Configuration\n\nThe frontend has **no build-time `.env`**. The API URL is injected two ways:\n\n- **Dev:** `make dev` passes `NEXT_PUBLIC_API_URL=http://localhost:8080/api` on the command line.\n- **Static export / prod:** runtime injection — `inject-env.sh` writes `window.__ENV__`\n  into `/env-config.js` at container start, loaded by `app/layout.tsx` and\n  consumed by `packages/shared/src/lib/config.ts`.\n\n### Available Commands\n\nRun `make help` (repo root) to see all available commands.\n\n---\n\n## Development\n\n### Prerequisites\n\nInstall dependencies:\n\n```bash\nnpm install\n```\n\n### Running the Application\n\nStart the development server with hot reload:\n\n```bash\nNEXT_PUBLIC_API_URL=http://localhost:8080/api npm run dev\n```\n\nOr using Make (repo root):\n\n```bash\nmake dev\n```\n\n### Code Quality\n\nFormat and check code:\n\n```bash\nnpm run format   # Prettier (CI gate)\nnpm run lint     # ESLint\nnpm run lint:ts  # Type check\nnpm run type-check\n```\n\n> `make code-check` (repo root) is backend-only (gofumpt + golangci-lint).\n\n### Building for Production\n\n```bash\nnpm run build   # static export -> out/\n```\n\nServing options:\n\n```bash\nmake frontend-up      # nginx container serving out/ on :3000 (/api -> api:8080)\nmake deploy-frontend  # rebuild the export and copy it into the running container\n```\n\n---\n\n## Docker\n\n| Target | Purpose |\n|---|---|\n| `make fe-run-dev` | Dev container with hot reload on :3000 (mounts `frontend/`) |\n| `make fe-build-dev` | Build the dev image (`Dockerfile.dev`) |\n| `make fe-logs-dev` | Follow dev container logs |\n| `make fe-shell-dev` | Shell into the dev container |\n| `make fe-docker-up` | Prod image (`Dockerfile`) on :3000 — bakes the prod API URL |\n| `make fe-docker-down` | Stop/remove the prod-build container |\n| `make fe-docker-restart` | down + up |\n| `make fe-clean` | Remove containers + images + docker prune |\n\n---\n\n## Tests\n\n- Unit: `npm test` (Vitest, jsdom) — theme context, auth guard, theme toggle, `globals-parity` (palette hex parity with `theme-colors.ts`)\n- E2E: `npm run test:e2e` (Playwright) — auth guard, login, notes CRUD, smoke (see [tests.md](./tests.md))\n- Coverage: `npm run test:coverage`\n\n---\n\n## Available Scripts\n\n- `npm run dev` - Start development server\n- `npm run build` - Static export to `out/`\n- `npm run start` - Start production server (non-export)\n- `npm run lint` - Run ESLint\n- `npm run lint:ts` / `npm run type-check` - Type check with TypeScript\n- `npm run format` - Format code with Prettier\n- `npm run test` / `test:watch` / `test:coverage` - Vitest\n- `npm run test:e2e` - Playwright E2E\n- `npm run prepare` - Install Husky git hooks\n\n---\n\n## License\n\nMIT License - free to use for learning and personal projects."},"mobile":{"title":"Mobile","md":"The Android app lives in [`apps/mobile/`](../apps/mobile/) and shares business logic (services, types, i18n) with the web frontend via [`packages/shared/`](../packages/shared/). Stack: Expo SDK 57, React Native, expo-router, NativeWind.\n\n## Building the APK (local Gradle build)\n\nRequires a one-time toolchain setup, then a two-command build. Validated on Ubuntu 24.04 (WSL2), JDK 21, Expo SDK 57 / RN 0.86.\n\n### One-time toolchain setup\n\n1. **JDK** (AGP 8.x needs JDK 17+; 21 is the Ubuntu 24.04 default):\n\n   ```bash\n   sudo apt update && sudo apt install -y openjdk-21-jdk\n   ```\n\n2. **Android cmdline-tools** (no sudo):\n\n   ```bash\n   mkdir -p ~/Android/Sdk/cmdline-tools\n   curl -sSL -o /tmp/tools.zip \\\n     https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip\n   unzip -q /tmp/tools.zip -d /tmp/\n   mv /tmp/cmdline-tools ~/Android/Sdk/cmdline-tools/latest\n   ```\n\n3. **Environment variables** — append to `~/.bashrc`, then `source ~/.bashrc`:\n\n   ```bash\n   export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64\n   export ANDROID_HOME=$HOME/Android/Sdk\n   export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$JAVA_HOME/bin:$PATH\n   ```\n\n4. **Licenses + SDK components**:\n\n   ```bash\n   yes | sdkmanager --licenses\n   sdkmanager \"platform-tools\" \"platforms;android-36\" \"build-tools;36.0.0\"\n   ```\n\n   The exact component versions come from React Native: check\n   `node_modules/react-native/gradle/libs.versions.toml` (`compileSdk`, `buildTools`) —\n   currently 36 / 36.0.0 for RN 0.86. Re-check there whenever RN bumps.\n\n### Build modes\n\nThe API base URL is resolved in `apps/mobile/lib/storage-init.ts`:\n\n1. **Profile-screen override** (stored in SQLite, must start with `https://`) — wins over everything.\n2. **`EXPO_PUBLIC_API_URL`** baked into the JS bundle at build time.\n3. **Fallback:** the prod API (`https://lifetracker.lautaroblasco.com.ar/api`).\n\n- **Prod (default):** a plain `assembleRelease` with no env config bakes the prod URL — nothing to configure. Cleartext is handled by the custom prebuild plugin `apps/mobile/plugin/withCleartextManifest.js` (registered in `app.json`), which sets `android:usesCleartextTraffic` per build type (debug: true, release: false).\n- **Dev (emulator):** `apps/mobile/.env.example` (copy to `.env` if you want a bake) sets `http://10.0.2.2:8080/api`; the prebuild-generated project loads it when bundling in development mode (`expo start` / `npx expo run:android`). Release builds ignore it.\n\nThe Profile-screen URL override is the escape hatch: a wrong bake is recoverable without a rebuild (but clear the override if it points somewhere stale — it beats the baked value).\n\n### Build\n\n```bash\ncd apps/mobile\nnpx expo prebuild --platform android --no-install   # generates android/ (git-ignored)\ncd android\n./gradlew :app:assembleRelease\n```\n\nFirst run downloads Gradle + Maven deps (~1–2 GB) and takes ~12 min; subsequent runs are incremental and much faster. No device or emulator is needed for `assembleRelease` (unlike `npx expo run:android`, which is the dev loop).\n\n### Output location\n\nThe APK lands at:\n\n```\napps/mobile/android/app/build/outputs/apk/release/app-release.apk\n```\n\nNote: `apps/mobile/android/` is git-ignored (generated by prebuild), so the APK is not committed — it is recreated by each build. Copy it somewhere stable if you want to keep an artifact:\n\n```bash\ncp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ~/Downloads/lifetracker.apk\n```\n\nSigning: with no release keystore configured, the Expo template falls back to the auto-generated `debug.keystore` — installable on any device, **not** suitable for the Play Store.\n\n### Installing on a phone (from WSL2)\n\nWSL2 has no USB passthrough by default, so the simplest path is serving the APK over the LAN:\n\n```bash\ncd apps/mobile/android/app/build/outputs/apk/release\npython3 -m http.server 8899\n```\n\nThen on the phone, browse to `http://\u003cmachine-LAN-IP>:8899/app-release.apk` and install (Android will ask to allow \"install unknown apps\").\n\n## EAS cloud build (alternative)\n\nNo local toolchain needed; requires an Expo account and waits in the build queue:\n\n```bash\ncd apps/mobile\nnpx eas-cli login                  # Expo account (create one at expo.dev)\nnpx eas-cli build --platform android --profile preview\n```\n\nThe `preview` profile produces an APK for internal distribution. When the build finishes (~15–25 min) you get a QR code + URL to install directly on a device. The `production` profile produces the release app-bundle with the prod API URL baked in.\n\n> If you prefer a global install over `npx`, run `npm config set prefix ~/.npm-global && export PATH=\"$HOME/.npm-global/bin:$PATH\"` once, then `npm install -g eas-cli`.\n\n## App structure\n\nRoutes live in `apps/mobile/app/` (expo-router): a tabs layout (`(app)/_layout.tsx`) with **activities**, **finance** (dashboard + transactions tabs), **notes**, **profile**, **social**, **time**; plus login / register / index and public profiles (`user/[username]`).\n\n- **UI primitives:** `components/ui/` (button, card, form-field, option-select, segmented-tabs, filter-modal, streak-badge, toast…) — always reuse before creating.\n- **Feature components:** `components/\u003cfeature>/` (activity, finance, profile, reminder, time).\n- **lib/:** `storage-init.ts` (must be the **first import** in the entry — installs the storage adapter + API URL before shared services init), `theme-provider.tsx` + `use-colors.ts`, `dolarapi.ts`, `data-backup.ts`, `filter-options.ts`, `format-time.ts`.\n- **Tokens:** `apps/mobile/tailwind.config.js` duplicates `theme-colors.ts` — keep in sync (see [../styles.md](../styles.md)).\n- **Tests:** jest-expo (`jest.config.js` + `jest.setup.js`) — streak badge + time formatting.\n\n## Dev loop (Windows emulator + WSL build)\n\nThe primary documented loop is the root Makefile target, which bootstraps everything (emulator boot, prebuild if needed, APK install, API + Metro detached, app launch) and then offers an interactive key loop:\n\n```bash\nmake mobile        # emulator + build + API + Metro + launch; [R] rebuilds, Enter relaunches, q quits\nmake mobile-rebuild # rebuild the native app + reinstall (same as the [R] key)\nmake mobile-logs    # tail API + Metro logs\nmake mobile-stop    # stop what make mobile started\n```\n\nAlternatively, a plain debug build on a connected device/emulator:\n\n```bash\ncd apps/mobile\nnpx expo run:android\n```"},"deployment-modes":{"title":"Deployment Modes","md":"The stack runs in three container/host modes plus the mobile dev loop, one diagram each. All are started from the repository root (`make dev`, `make dev-container`, `make dev-full`, `make mobile`) and stopped with `make stop`; see [Getting Started](./getting-started.md) for details.\n\n## 1. `make dev` — fast lane (host-run, hot reload)\n\n`next dev` serves the app on `:3000` with HMR and the API hot-reloads on the host with air (`:8080`), so a save is live in seconds — no image rebuild, no static export. Only the databases run in compose (`:5432`, `:27017`); the frontend talks to the API directly and the backend's CORS middleware allows it in dev. Migrations run from the API on every (re)start. Ctrl-C stops air and the frontend; the databases stay up until `make stop` / `make db-down`.\n\nUse this for the daily edit loop. It does not exercise the prod Dockerfile, the static export, or the nginx proxy — that's what the container lane is for.\n\n## 2. `make dev-container` — container mode\n\n```\n  Browser                                 Mobile app\n      |                                       |\n      | :3000                                 | :8080 (direct, bypasses nginx)\n      v                                       v\n  +------------------+  /api/* proxy    +------------------------------------+\n  | lifetracker-web  |                  |      api (golang_api_server)       |\n  |   nginx:alpine   |----------------->|            Go API (Gin)            |\n  |  static export   |                  | embedded migrations on each start  |\n  +------------------+                  +-------+-----------------+----------+\n                                                |                 |\n                                                v                 v\n                                         +-------------+   +-------------+\n                                         |  postgres   |   |   mongodb   |\n                                         |    :5432    |   |   :27017    |\n                                         | (loopback)  |   | (loopback)  |\n                                         +-------------+   +-------------+\n\n  (all containers on the compose network: infra_golang_api_network)\n```\n\nEverything is a plain Docker container on a single compose network (`infra_golang_api_network`): the Go API (`:8080`), PostgreSQL (`:5432`), MongoDB (`:27017`), and the frontend. nginx serves the static Next.js export on `:3000` and proxies `/api/*` to the API container, so the browser talks same-origin and CORS never enters the picture. The mobile app bypasses nginx and hits the API directly on `:8080`. Migrations are **embedded in the API** and run automatically on every API (re)start; `make dev-container` additionally runs an explicit standalone migrate step (`scripts/migrate.sh`) inside the network after `compose up`.\n\nThis is the classic \"compose up\" deployment and the parity check that the prod-built image and export still work — the same command deploys the app on any host with Docker. Re-run it after changes (nothing watches files here).\n\n## 3. `make dev-full` — container mode + observability\n\n```\n  +------------------+ scrapes +----------------+ queries +--------------+\n  |    api :8080     |\u003c--------|   prometheus   |\u003c--------|   grafana    |\n  |     /metrics     |         |     :9090      |         |    :3001     |\n  +------------------+         +--------+-------+         +----------+---+\n                                        |                            ^\n                                        | scrapes                    |\n  +------------------+                  |                            |\n  |  node-exporter   |\u003c-----------------+                            |\n  |  (host metrics)  |                                               |\n  +------------------+                                               |\n                                                                     |\n                                                             queries |\n  +--------------+  ships logs +----------------+                    |\n  |   promtail   |------------>|      loki      |--------------------+\n  |              |             |     :3100      |\n  +--------------+             +----------------+\n\n  (publishes on 127.0.0.1 only — SSH tunnel from outside the box)\n```\n\nIdentical to container mode, plus the `observability` compose profile: Prometheus (`:9090`) scrapes the API's `/metrics` endpoint and node-exporter; Grafana (`:3001`) dashboards over Prometheus metrics and Loki logs; Promtail ships container logs into Loki (`:3100`). Use it when you want metrics, logs, and dashboards locally — typically while running the k6 load tests in [`loadtest/`](../loadtest/).\n\n_Diagrams are ASCII — regenerate `docs/index.html` with `make docs` after editing._"},"styles":{"title":"Styles (UI contract)","md":"This is the contract for how UI should look across the web frontend\n(`frontend/`) and the mobile app (`apps/mobile/`). The design language is **Warm Minimalism**: warm neutral\nbackgrounds, sage green as the primary accent, amber reserved for highlights,\nsubtle borders instead of shadows, and full light/dark support. Read this\nbefore creating or modifying any component, layout, or styling. Humans: same\nrules apply.\n\n## Platform map\n\n| | Web (`frontend/`) | Mobile (`apps/mobile/`) |\n|---|---|---|\n| Styling | Tailwind CSS **v4** | NativeWind 4 (Tailwind **v3** preset) |\n| UI primitives | shadcn/ui → `frontend/components/ui/` | Hand-rolled → `apps/mobile/components/ui/` |\n| Colors defined in | `frontend/app/globals.css` (hex CSS vars, exact parity with `theme-colors.ts`) | `apps/mobile/tailwind.config.js` (hex, paired light + `dark-*` tokens) |\n| Dark mode | `.dark` class + `@custom-variant dark` | `dark:` variants of paired `dark-*` tokens |\n| Theme switching | `ThemeContext` (`frontend/contexts/theme-context.tsx`): class toggle, `system`/`light`/`dark` preference in `localStorage('theme')` | `ThemeProvider` drives `Appearance.setColorScheme` (`'unspecified'` = follow OS) |\n| Icon library | Lucide React | Lucide React Native |\n| `cn()` helper | `@/lib/utils` | `apps/mobile/lib/cn` |\n\n**Single source of truth for the palette:** [`packages/shared/src/lib/theme-colors.ts`](packages/shared/src/lib/theme-colors.ts). Both platforms derive their tokens from it. Never invent a color not present there.\n\n**Automated guards (run on every palette change):**\n- `packages/shared/src/lib/theme-colors.test.ts` — token contract + WCAG AA contrast for critical pairs.\n- `frontend/app/globals-parity.test.ts` — `globals.css` hex values must exactly match `theme-colors.ts`.\n\n## Color rules\n\n- **Never hardcode colors** (hex, oklch, rgb, named, Tailwind palette classes like `text-green-600`). Use tokens.\n- Token names are identical across platforms for `bg-primary`, `bg-secondary`, `bg-danger`, `bg-success`, `bg-warning`, `bg-surface`, `border-border`, `text-foreground`.\n- Platform differences to watch:\n  - Web has shadcn extras: `card`, `popover`, `muted`, `accent`, `destructive`, `ring`, `input`, `sidebar-*`, `chart-1..5`. `--card`/`--popover`/`--destructive`/`--muted-foreground`/`--ring`/`--sidebar-*` alias the canonical shared tokens — don't give them independent values.\n  - Mobile's muted text is `text-muted` (mapped from `textMuted`); the web equivalent is `text-muted-foreground`.\n  - Mobile always pairs base + dark token: `bg-surface dark:bg-dark-surface`. Web only needs one class; the `.dark` variant resolves via CSS vars.\n  - Mobile dark surfaces are registered as separate `dark-*` colors, so on-fill *ink* also needs its dark twin (e.g. `text-primary-foreground dark:text-dark-primary-foreground`).\n- Typography/spacing differentiate muted text from foreground rather than adding new grays or opacity hacks (`opacity-50` is reserved for disabled/loading states).\n\n### Palette (`theme-colors.ts`; web `globals.css` mirrors it exactly)\n\n| Role | Light | Dark |\n|---|---|---|\n| background | `#f5f2ea` (warm) | `#1c1d19` (warm charcoal, never pure black) |\n| surface | `#ffffff` | `#262821` |\n| surface-elevated | `#ffffff` | `#33352c` |\n| foreground (primary text) | `#30372f` | `#f2efe6` |\n| muted text | `#6a6c61` | `#aaa99f` |\n| primary (sage, CTAs/selected/progress) | `#5c6f55` | `#a5b59a` |\n| primary-foreground | `#ffffff` | `#1c1d19` |\n| secondary (warm amber — highlights) | `#d6a36d` | `#d8b58a` |\n| accent (sage-tinted hover/selected surface) | `#e3e7dc` | `#2f332a` |\n| danger | `#b54d45` | `#d98878` |\n| success | `#477653` | `#8fbf96` |\n| warning | `#96642a` | `#d8b58a` |\n| border | `#e8e3d8` | `#3a3c33` |\n| sticky (sticky-note card) | `#f4e8d4` | `#3e3524` |\n\n### Color usage rules\n\n- Warm neutrals are the default; **sage green is reserved for primary actions, selected states, and progress**.\n- **Amber (`secondary`) is a highlight, not a text color on light surfaces** — it fails 3:1 there. Use it as a tinted background (`bg-secondary/10`) with dark ink (`text-foreground`), or use `text-warning` when amber text is needed in both modes.\n- Semantic colors (success/warning/danger) are for state and feedback only, and are always paired with an icon or label — never color alone.\n- Dark mode is role-adapted, not inverted: accents get lighter, backgrounds get warm charcoal.\n- WCAG AA is the floor: 4.5:1 normal text, 3:1 large text/UI components. The contrast test enforces the critical pairs; new pairs go into the test.\n\n## Typography\n\n- **Web:** Geist Sans/Mono (already wired via `--font-sans`/`--font-mono`). Playfair Display is available as `font-brand` for the brand mark / editorial headings only — don't spread it to body text.\n- **Mobile:** the system default font.\n- Scale: page titles 28–32px w600–700; section titles 18–22px w600; body 14–16px w400; supporting text 12–14px; prominent numerals 28–36px w600.\n- **Numerals:** apply `tabular-nums` to prominent values and aligned numeric columns (dashboard stats, timers, tables).\n\n## Page header (web)\n\nEvery web page renders exactly one shared `PageHeader`\n([`frontend/components/ui/page-header.tsx`](frontend/components/ui/page-header.tsx)):\na full-width bar with `border-b border-border`, the `h1` page title plus a\none-line description on the left, and the page's controls (tabs, filters,\nprimary action) on the right. It stacks vertically below `md`. Page content\nlives in its own container *below* the bar — `max-w-4xl mx-auto p-4 md:p-6`\nby default, or full-bleed for tool pages like Notes. Do not hand-roll a\nper-page header block; pass `title`, `description`, and the controls as\nchildren.\n\n## Spacing, radius, elevation\n\n- Spacing scale: 4 / 8 / 12 / 16 / 24 / 32 / 48 (Tailwind default steps; prefer 4 and 8 over odd values).\n- Radius (web, from `--radius: 0.75rem`): buttons/inputs `rounded-md` (10px), cards `rounded-lg` (12px), `rounded-xl` (16px) for hero surfaces. Mobile mirrors with explicit `rounded-*` classes.\n- Borders over shadows: 1px `border-border` on cards/surfaces. Shadows only for genuinely floating elements (popovers, menus, toasts) — **never decorative \"inset glow\" or colored glows**.\n- Standard button height `h-10` web (`h-11` for hero CTAs); mobile touch targets ≥ 44×44.\n- Cards only for meaningful groups; avoid nesting cards inside cards. Establish hierarchy with spacing, typography, and surface contrast.\n\n## Component reuse rules (in priority order)\n\n1. **Web:** use existing shadcn primitives in `frontend/components/ui/` before writing anything. If a needed one isn't there, add it via shadcn (`npx shadcn@latest add \u003cname>`) rather than hand-rolling.\n2. **Mobile:** use `apps/mobile/components/ui/` (`button.tsx`, `card.tsx`, `form-field.tsx`, `option-select.tsx`, `segmented-tabs.tsx`). Extend these with variants/props instead of creating parallel components.\n3. **Feature-specific components** (`frontend/components/notes`, `frontend/components/ui/card`, `frontend/components/ui/filterModal`, `apps/mobile/components/activity`, `apps/mobile/components/finance`) hold composed, feature-specific pieces. Promote to `ui/` only when genuinely shared across features or platforms.\n4. **Business logic, types, i18n** → `packages/shared`. Never duplicate in frontend/mobile.\n5. Feature screens live in `frontend/app/\u003cfeature>` (App Router) and `apps/mobile/app/\u003cfeature>` (expo-router). Keep styling in components, not pages.\n\n## Baseline look\n\n- Cards: surface background (web `bg-surface`), 1px `border-border`, `rounded-lg`, `p-4`. Titles `font-semibold`; supporting text `text-muted-foreground`.\n- Buttons: default = solid `bg-primary`/`text-primary-foreground`; secondary = `bg-muted`; outline = `bg-surface` + border; ghost; destructive = `bg-danger` semantics. All variants keep hover/active/focus/disabled states and `rounded-md`.\n- Charts: use the shadcn `chart.tsx` wrapper (`ChartContainer` + `ChartConfig`) with token colors — never raw hex fills. Semantic data (income/expense) maps to success/danger. Gridlines/axes use `border`/`text-muted`.\n- Progress: `bg-primary` fill on a `border`/`muted` track; calm, no aggressive animation.\n- Feedback: success/warning/danger only from palette tokens; on-fill text uses `primary-foreground` (never bare `text-white` — it fails AA on dark-mode fills).\n- Ranking of visual surface (web): `background` \u003c `surface/card` \u003c `popover/surface-elevated`. In dark mode surfaces get lighter, never darker.\n- Don't introduce new animation libraries; existing stack covers transitions. Respect reduced-motion for anything beyond micro-transitions.\n\n## Don'ts\n\n- No hardcoded colors, no inline `style={{ color: ... }}` for themed values.\n- No new component libraries (no Radix directly outside shadcn wrappers, no new icon packs).\n- No per-platform visual divergence beyond what platform primitives require — tokens must stay in sync with `theme-colors.ts` (web parity is test-enforced).\n- No pure black (`#000`) backgrounds, pure white text on dark surfaces, or gradients as decoration.\n- Don't edit `globals.css` palettes or `apps/mobile/tailwind.config.js` directly for UI changes; change `theme-colors.ts` first, run the contract tests, then propagate.\n\n## Where themes/tokens are wired (for token changes)\n\n- Shared: `packages/shared/src/lib/theme-colors.ts` (+ `theme-colors.test.ts` contract/AA tests).\n- Web: `frontend/app/globals.css` (`:root`/`.dark` hex must match `theme-colors.ts` — `app/globals-parity.test.ts`), `@theme inline` token mapping, `frontend/contexts/theme-context.tsx` (class toggle + `system` preference; no runtime var injection), pre-paint theme script in `app/layout.tsx`.\n- Mobile: `apps/mobile/tailwind.config.js` (duplicates `theme-colors.ts`; keep in sync), `apps/mobile/lib/theme-provider.tsx`, `apps/mobile/lib/use-colors.ts` (token palette for non-Tailwind props)."},"tests":{"title":"Tests","md":"What each suite in the repo covers, and the one command that runs it. The\nroot Makefile is the single entry point for all of them:\n\n- `make test` — every unit/component suite in one go (shared · web · mobile ·\n  backend). No E2E inside it.\n- `make tests` — prints every test command with a one-liner each.\n- E2E and performance are separate targets (`make test-backend-e2e`,\n  `make test-web-e2e`, `make loadtest`): they need extra infrastructure\n  (isolated test DBs, the full-stack container lane, the k6 stack) and run\n  slower — opt in deliberately.\n\nDetails and conventions: see the per-project sections below (this file is\nthe source of truth; `docs/index.html` is generated from it by `make docs`).\n\n## Test kinds per project\n\n| Project | Unit | Component | Integration | E2E | Performance |\n|---|---|---|---|---|---|\n| backend | service logic, table-driven | — | repositories/controllers against the real compose test DBs — **one suite with unit, no tag split** | `tests/e2e` (`e2e` build tag): production router + real JWT | k6: smoke on PRs, full suite nightly |\n| web (`frontend/`) | pure logic: calendar libs, palette parity | components/contexts with RTL + jsdom; `@shared` services mocked | — | Playwright (chromium) on the full-stack container lane | — |\n| shared (`packages/shared/`) | pure TS logic: theme tokens, i18n en/es parity, auth service — protects both consumers at once | — | — | — | — |\n| mobile (`apps/mobile/`) | pure logic: dates, input formatting | RNTL components; `className` is inert under jest, so tests assert behavior, not styling | — | none yet (Maestro deferred) | — |\n\n## Backend tests\n\n`make test-backend` — unit and integration as one suite\n(`gotestsum --format=short-verbose`, testify inside).\nService logic is table-driven (`internal/domain/\u003cname>/service`); repositories\nand controllers run against isolated Docker test databases — mocking GORM is\nworse than the isolation the compose DBs give — and controller tests build\ntheir own routers with inline auth fakes.\n\n| Command | What it does |\n|---|---|\n| `make test-backend` | Starts test DBs (`docker-compose.yml` with `backend/.env.test`), runs `gotestsum -race`, stops DBs |\n| `make test-backend-only` | Runs the suite against already-running test DBs |\n| `make test-backend-coverage` | Same suite + coverage profile (report-only) |\n| `make code-check` | Format + lint (`golangci-lint`) |\n| `make db-test-up` / `make db-test-down` / `make db-test-remove` | Manage the test databases manually (up / stop / remove + volumes) |\n\nCoverage is report-only for now — no threshold yet; a ratchet (fail PR if the total drops) is planned once suites mature. Baseline (Oct 2026): **49.1% of statements** across 805 tests.\n\n### Essential E2E suite (build tag `e2e`)\n\n`make test-backend-e2e` — `backend/tests/e2e/` exercises the **production router** (real route registry, real JWT auth middleware, full middleware chain) against the real test DBs — unlike the controller tests, which build their own routers with inline auth fakes.\n\n- Run locally and in CI (compose test DBs).\n- Runs in CI inside the backend `test` job.\n- Excluded from the default suite by the `//go:build e
