2e` tag, so `make test-backend` (and the `make test` aggregate) stays fast.\n- Scope (deliberately small): health, register → login → refresh (real JWT issuance), anonymous call to a protected route → 401, `/users/me` + `/activities/today`, activity + note create/list lifecycle with the issued token.\n- Data strategy: unique usernames per run (`e2e_\u003ctimestamp>`), no truncation — coexists with the unit suite on the same DBs.\n\n## Shared package tests (Vitest)\n\n`make test-shared` — pure-TS unit tests in a node environment (no DOM).\n`packages/shared` is consumed from source by web and mobile, so this suite\nprotects both clients at once.\n\n| Command | What it does |\n|---|---|\n| `make test-shared` | `npm test -w @life-tracker/shared` (`vitest run`) |\n| `npm test:watch -w @life-tracker/shared` | watch mode |\n\n- Config: `packages/shared/vitest.config.ts`; tests live next to the source (`src/**/*.test.ts`).\n- Current coverage: theme token contract (`theme-colors`), i18n en/es key parity, `auth-service` (login/register error mapping, token refresh, authenticated-request retry + logout on refresh failure).\n- Conventions: mock `fetch` with `vi.stubGlobal`; install a storage adapter with `setStorageAdapter` before importing the singleton `authService`; reset service state via `authService.logout()` in `afterEach`.\n\n## Web tests (Vitest + Testing Library)\n\n`make test-web` — component tests under jsdom: `frontend/` has its own npm\ninstall (outside the workspaces) with Vitest + `@testing-library/react`.\nTests run against components, never the network: `@shared` services are\nreplaced with `vi.mock`. What they cover: rendering, interaction\n(localStorage persistence, redirects, toggles) and cross-framework contracts\n(palette parity) — the pieces you can verify cheaply, in milliseconds.\n\n| Command | What it does |\n|---|---|\n| `make test-web` | `npm test` in `frontend/` (`vitest run`) |\n| `npm run test:watch` | watch mode |\n\n- Config: `frontend/vitest.config.ts` (jsdom, `globals: true`, `@shared` → `../packages/shared/src` alias mirroring tsconfig); setup file `frontend/test/setup.ts` (jest-dom).\n- Current coverage: `ThemeProvider`/`useTheme` (localStorage persistence, CSS variable application), `ThemeToggle` (shadcn render + interaction), `AuthGuard` (auth service mocking + redirect), and `globals-parity` (frontend palette hex must exactly match `theme-colors.ts`), plus calendar components/lib logic.\n- Conventions: mock `@shared/services/*` with `vi.mock('\u003cmodule>', factory)` — never import the real service into a component test; mock `next/navigation`'s `useRouter`; RTL cleans up automatically (`globals: true`).\n\nCoverage is report-only: `npm run test:coverage` (Vitest v8 provider, text + html in `coverage/`). CI prints the totals line to the job summary and uploads the html report as an artifact. Baseline (Oct 2026): **98.24% statements** — but only 4 files are under test (theme context, theme toggle, auth guard, globals parity); feature folders have zero unit coverage yet.\n\n### Web E2E (Playwright, essential suite)\n\n`make test-web-e2e` — the critical user paths driven through a **real\nbrowser** against the **full-stack container lane** (static export served by\nnginx with the `/api` proxy — the deploy lane, not a dev server), with real\nAPI, real DBs and real auth: exactly what the component tests deliberately\nmock out. Specs: auth-guard redirect + authenticated shell, real UI login,\nnotes CRUD through the UI, deploy-lane canary (`/env-config.js` + app title).\n\n| Command | What it does |\n|---|---|\n| `make test-web-e2e` | Playwright, headless (chromium), against the container lane — fails fast if `make dev-container` isn't up |\n| `make test-web-e2e-ui` | headed, prompts for lane (containers/dev), local-dev only; `E2E_SLOWMO_MS=\u003cms>` to make the flow watchable |\n| `make dev-container` | Bring up the lane the specs target (postgres + mongodb + api + nginx static export; run `make stop` first if a different mode is up) |\n\n- Config: `frontend/playwright.config.ts` — chromium only (opt into firefox/webkit with `E2E_ALL_BROWSERS=1`), `workers: 1` (specs share backend state), `retries: 2` in CI, trace `retain-on-failure`. `npx playwright test` in `frontend/` also works directly.\n- Auth seeding: `e2e/helpers.ts` registers a fresh user through the API (unique username per run) and seeds the exact localStorage keys the shared auth-service hydrates (`accessToken`, `refreshToken`, `currentUser`) via `page.addInitScript` — survives reloads.\n- CI: `frontend-ci.yml` `e2e` job brings up the lane (`make dev-container`), waits for API/frontend health, runs the suite headless, uploads the HTML report on failure.\n\n## Mobile tests (jest-expo + React Native Testing Library)\n\n`make test-mobile` — unit tests for pure logic (dates, input formatting) and\ncomponent tests with `@testing-library/react-native`: a component renders in\na lightweight in-process tree and assertions check its behavior (labels,\ntiers, visibility). `className` is inert under jest, so styling is never\nasserted — visual/runtime-vs-native behavior is what device testing would\ncover, and is deferred.\n\n| Command | What it does |\n|---|---|\n| `make test-mobile` | `npm run test -w apps/mobile` |\n\n- Config: `apps/mobile/jest.config.js` (preset `jest-expo`, `@shared/*` mapped to source); `apps/mobile/jest.setup.js` stubs `react-native-svg` and `lucide-react-native` (native/ESM modules with no jest bridge; icons are not under test).\n- `babel.config.js` compiles jest runs with the plain react JSX runtime (`api.caller` detection) instead of NativeWind's interop runtime — the interop transform rewrites every `createElement` and breaks jest mock factories. Consequence: `className` is inert under jest, so unit tests assert behaviour, not styling.\n- Current coverage: `StreakBadge` (tiers, zero/hide), input formatting + date round-trips (local thousands/date-input utilities, incl. `@shared/utils/format`), calendar week logic.\n- Conventions: import test globals from `@jest/globals` (explicit imports); `render` is **async** in RNTL v14 — always `await render(...)` before querying via `screen`.\n\nDevice E2E (Maestro) is deferred; when it exists it will be `make test-mobile-e2e`.\n\n## CI\n\nPR CI is dependency-aware: each workflow's `paths:` filter triggers only the suites that could be affected.\n\n- `frontend-ci.yml` → prettier, `npm test` (vitest), **coverage report (artifact + job summary)**, `tsc --noEmit`, and the **`e2e` job** (Playwright essential suite on the full-stack container lane). Triggers on `frontend/**` + `packages/shared/**`.\n- `mobile-ci.yml` → type-check, `npm test` (jest-expo), shared package tests (vitest), expo export. Triggers on `apps/mobile/**` + `packages/shared/**` — so a shared-package change exercises both JS consumers.\n- `backend-ci.yml` → golangci-lint, integration suite **with coverage** against the compose test DBs (summary + artifact), **essential E2E suite** (build tag `e2e`), and the **`api-perf-smoke` job** (k6 `smoke.js` against the load-test stack's API; thresholds fail the PR). Triggers on `backend/**`, the compose/nginx/scripts files, `Makefile` — including the Makefile's test-target names.\n- `nightly-loadtest.yml` → full k6 suite on a daily cron (`0 3 * * *`) + manual dispatch (`REMOTE_WRITE=0`, reports artifact). Heavy lanes are nightly-only; PRs get the smoke lane only.\n- `release.yml` / `pr-title.yml` unchanged (release-please + Conventional Commits enforcement).\n\n## Load testing (k6)\n\nStress tests live in [`loadtest/`](../loadtest/) — k6 scenarios that fire hundreds of requests per second across hundreds of users at different rhythms, with **live metrics in Grafana while a test runs**. k6 runs in Docker, so no local install is needed.\n\n**Test lanes** — the same scripts target any lane via `BASE_URL`:\n\n| Lane | Target | Default URL |\n|---|---|---|\n| Backend direct | compose `api` container | `http://localhost:8080` |\n| Full stack | nginx frontend proxy (`make loadtest-fe-up`) | `http://localhost:3000` |\n| Static assets | nginx static export (frontend serving) | `http://localhost:3000` |\n\n**One command — the full suite**:\n\n```bash\nmake loadtest                  # stack up -> provision users -> smoke -> read/write/auth/mixed\n                               # -> features (full API coverage) -> cleanup.\n                               # Watch Grafana (:3001) while it runs.\n```\n\nOverrides propagate to every step: `make loadtest USERS=500 RATE=600 DURATION=2m` (full list in [`loadtest.md`](./loadtest.md)). Skip the final user cleanup with `CLEANUP=0`.\n\n**Advanced runs** (fine-tuning / specialized):\n\n```bash\nmake loadtest-breakpoint       # ramp VUs until the app collapses\nmake loadtest-soak SOAK_RATE=200 SOAK_DURATION=30m\nmake loadtest-static           # frontend serving lane (needs fe-up)\nmake loadtest-tap              # live API responses in the terminal\nmake loadtest-provision USERS=500   # just create users\nmake loadtest-cleanup          # just delete test users\n```\n\nEvery scenario streams its metrics live to Prometheus and stops on error-rate/p95 thresholds. Key overrides: `USERS`, `PREFIX`, `RATE`, `DURATION`, `BASE_URL`, `MAX_VUS`, `SOAK_*`, `LOGIN_RATE` (full table in [`loadtest.md`](./loadtest.md)).\n\n**Live monitoring** — k6 pushes metrics to the compose Prometheus every 1s (remote write), so Grafana (`http://localhost:3001`, default `admin/admin`) shows the load side and the app side while a test runs:\n\n- **Load Test** dashboard — merged view: VUs, req/s, error rate, p50/p95/p99, checks, plus app latency/errors by endpoint, DB connections, host CPU/mem.\n- **k6 Prometheus (Native Histograms)** — official Grafana k6 dashboard.\n- Existing per-domain dashboards (Activities, Finance, Notes, Time, Users & Auth, Nginx).\n\n```bash\nmake loadtest-stack-up                 # Prometheus + Grafana included\nmake loadtest-read-heavy RATE=600 DURATION=2m   # watch it live on :3001\nmake loadtest-tap                      # raw API responses in the terminal\nmake loadtest-tap TAP_PATH=/api/notes TAP_INTERVAL=2   # time | status | latency | body\n```\n\nNotes: disable live streaming with `REMOTE_WRITE=0`. The load-test stack is self-contained (the `loadtest` profile services in `docker-compose.yml` — pinned credentials, their own volumes), so it works regardless of `.env` and never touches dev DB data. Prometheus runs with remote-write receiver + native histograms enabled (`docker-compose.yml`), and app metrics are scraped every 5s (`backend/monitoring/prometheus.yml`). Dashboards are provisioned automatically from `backend/monitoring/grafana/provisioning/dashboards/`.\n\n**In CI**: PRs touching the backend run only `smoke.js` (one user, seconds, thresholds gate the PR) against the load-test stack's API — see the `api-perf-smoke` job in `backend-ci.yml`. The full suite runs nightly via `nightly-loadtest.yml` (cron `0 3 * * *`, also manual via workflow_dispatch; results artifact in `loadtest/reports/`). Heavy lanes are deliberately kept out of PRs."},"loadtest":{"title":"Load Testing","md":"Stress tests for the life-tracker API and frontend. Capable of hundreds of\nrequests per second against thousands of concurrent users, with per-user\nrhythms. k6 runs inside Docker — no local install needed.\n\n## Test lanes\n\n| Lane | Target | Default base URL | What it exercises |\n|---|---|---|---|\n| A — backend direct | compose `api` container | `http://localhost:8080` | Go app + Postgres + Mongo, no proxy noise |\n| B — full stack | nginx frontend proxy | `http://localhost:3000` | nginx static serving + `/api` proxy + backend (run `make loadtest-fe-up`) |\n| C — static assets | nginx static export | `http://localhost:3000` | pure frontend serving capacity (`static.js`) |\n\nAll scenario scripts take `LOADTEST_BASE_URL`, so one script runs against any lane.\n\n## Quickstart — one command\n\n```bash\n# Full suite: stack up -> provision users -> smoke -> read/write/auth/mixed\n# scenarios -> cleanup. ~5 minutes with defaults. Watch Grafana while it runs.\nmake loadtest\n```\n\nOverride anything, it propagates to every step:\n\n```bash\nmake loadtest USERS=500 RATE=600 DURATION=2m   # bigger pool, faster rate, longer scenarios\nmake loadtest BASE_URL=http://localhost:3000   # run the whole suite through nginx (needs fe-up)\nmake loadtest CLEANUP=0                        # keep the test users after the run\n```\n\n`make loadtest` = `make -C loadtest run` = stack up → provision → smoke →\nread-heavy → write-heavy → auth-storm → mixed-rhythms → features → cleanup.\n\nIndividual targets still exist for fine-tuning (breakpoint, soak, static, tap,\nprovision, cleanup, stack-*, monitoring-up, fe-*) — see `make loadtest-help` or the tables below.\n\n## Step-by-step (manual control)\n\nThe load-test stack is **self-contained** (the `loadtest` profile services in\n`../docker-compose.yml`): pinned DB credentials and its own volumes, so it\nworks regardless of `.env` and never touches dev DB data.\n\n```bash\nmake loadtest-stack-up                 # api + postgres + mongodb + prometheus + grafana + node-exporter\nmake loadtest-provision USERS=500      # create users (pool: ../loadtest/users.json, always fresh)\nmake loadtest-smoke                    # sanity check\nmake loadtest-read-heavy RATE=600 DURATION=2m\nmake loadtest-mixed-rhythms            # readers/writers/financers/spike\nmake loadtest-breakpoint MAX_VUS=1000  # ramp until the app collapses\nmake loadtest-soak SOAK_RATE=200 SOAK_DURATION=30m\nmake loadtest-cleanup                  # delete every pool user\nmake loadtest-stack-down               # stop the load-test stack\n```\n\n> Docker Desktop / WSL: if `--network host` is unavailable, use\n> `BASE_URL=http://host.docker.internal:8080` (and `:3000` for the full stack).\n\n## Scenario matrix\n\n| Script | Executor | Rhythm | What it measures |\n|---|---|---|---|\n| `provision.js` | shared-iterations | N parallel registers | register throughput (bcrypt is the server CPU cost) |\n| `smoke.js` | per-vu-iterations | single pass | end-to-end correctness before scaling |\n| `static.js` | constant-arrival-rate | flat req/s | nginx static serving ceiling |\n| `auth-storm.js` | constant-arrival-rate (2 scenarios) | flat login + refresh | bcrypt compare cost, token issuance |\n| `read-heavy.js` | constant-arrival-rate | flat req/s | read throughput; Postgres 10-conn pool cliff |\n| `write-heavy.js` | constant-arrival-rate | flat req/s | write throughput; Mongo `MaxConnecting(2)` throttle |\n| `mixed-rhythms.js` | ramping-vus + constant-vus | reader ~0.5–1.5s, writer ~4–8s, financer ~6–10s, spike burst | realistic multi-user traffic; per-VU identity via user pool |\n| `features.js` | constant-vus | full CRUD lifecycle sweep per iteration | **complete API coverage**: activities (+records/stats/revert/streak), notes, time records, routines, finances (transactions/fixed/payments/movements/monthly-stats), screen time, social (follows/pending/accept/subscriptions), users (search/update/checks), auth (password/email change) |\n| `breakpoint.js` | ramping-vus (stepped) | ramp to collapse | documented ceiling + failure mode |\n| `soak.js` | constant-arrival-rate | sustained minutes/hours | leaks, pool exhaustion, GC behavior |\n\n## Key variables\n\n| Variable | Default | Used by |\n|---|---|---|\n| `USERS` | 100 | provision |\n| `PREFIX` | `u\u003ctimestamp>` | provision (fresh prefix per run avoids collisions) |\n| `RATE` | 300 | read-heavy, write-heavy |\n| `DURATION` | 1m | read/write/auth/static |\n| `SOAK_RATE` / `SOAK_DURATION` | 200 / 30m | soak |\n| `LOGIN_RATE` / `REFRESH_RATE` | 100 / 50 | auth-storm |\n| `MAX_VUS` / `STEP` / `STEP_DUR` | 1000 / 200 / 1m | breakpoint |\n| `SPIKE_VUS` | 250 | mixed-rhythms |\n| `BASE_URL` | `http://localhost:8080` | all |\n| `LOADTEST_USERS_FILE` | `users.json` | pool-using scripts |\n\n## Live monitoring (watch the test as it runs)\n\nThe stack ships Prometheus + Grafana. Scenario runs stream k6 metrics to\nPrometheus in real time (remote write), so Grafana shows both the load side and\nthe app side live while a test executes.\n\n```bash\n# 1. Start the stack — Prometheus + Grafana included (Grafana on :3001)\nmake loadtest-stack-up\n\n# 2. Open http://localhost:3001 (admin / admin) and pick a dashboard:\n#    - \"Load Test\"                -> merged view: k6 load + app latency/errors + host\n#    - \"k6 Prometheus (Native Histograms)\" -> official k6 dashboard\n#    - \"LifeTracker - \u003cdomain>\"   -> existing per-domain dashboards\n\n# 3. Run any scenario — metrics appear live (~1s push, 5s scrape)\nmake loadtest-read-heavy RATE=600 DURATION=2m\n\n# 4. Optional: watch raw API responses in the terminal while it runs\nmake tap                       # taps /api/activities/today every 1s\nmake tap TAP_PATH=/api/notes TAP_INTERVAL=2\n```\n\nMechanics:\n- k6 runs with `-o experimental-prometheus-rw` by default\n  (`K6_PROMETHEUS_RW_SERVER_URL`, push every 1s, trend metrics as native\n  histograms). Disable with `REMOTE_WRITE=0`.\n- Prometheus must run with `--web.enable-remote-write-receiver` and\n  `--enable-feature=native-histograms` — already set in `../docker-compose.yml`.\n- App metrics (`lifetracker_http_*`, `lifetracker_db_connections_active`, ...)\n  are scraped every 5s (`../backend/monitoring/prometheus.yml`).\n\n## Reports & monitoring\n\n- Scenario runs write raw k6 metrics to `../loadtest/reports/\u003cscript>-\u003ctimestamp>.json` — except `smoke`, `static` and `provision`, which print only the terminal summary (no `--out json`).\n- The terminal summary already prints req/s, p50/p95/p99, and error rates.\n- During a run, watch Grafana (`http://localhost:3001`, dashboards listed above)\n  and optionally `make tap` for raw responses.\n- Prometheus + Grafana run with the compose stack (`make loadtest-stack-up` or `make loadtest-monitoring-up` — the latter delegates to the root `monitoring-up`, the full observability profile: Prometheus, Grafana, Loki, Promtail, node-exporter); the API exposes `/metrics`. Watch `http_req_duration`, pool waits, and Mongo connection saturation during runs.\n\n## Known bottlenecks to look for\n\n- **Postgres pool**: `SetMaxOpenConns(10)` — expect p99 to climb first under\n  read/write concurrency. This is a tuning finding, not a test failure.\n- **Mongo**: `SetMaxConnecting(2)` throttles connection ramp.\n- **bcrypt**: every register/login does a `DefaultCost` hash/compare.\n- **Tokens**: access tokens default to 24h expiry — pools are session-scoped;\n  soaks longer than that need a refresh step or a fresh pool.\n\n## Cleanup\n\n`make loadtest-cleanup` deletes every user in `users.json` (each with its own\ntoken). Rows created by write scenarios are removed with the users. For a hard\nreset of the load-test stack (fresh DBs):\n\n```bash\nmake loadtest-stack-down\ndocker compose -f ../docker-compose.yml --profile loadtest down -v\n```"},"ci-cd":{"title":"CI/CD","md":"GitHub Actions workflows live in `.github/workflows/` at the **repository root** (GitHub only auto-discovers workflows there — workflows nested inside sub-projects are ignored).\n\n## `backend-ci.yml`\n\n- **`test` job**: path-filtered on pushes (`backend/**` plus compose/nginx/scripts/`Makefile`); on PRs it runs unconditionally (required checks — see Merge ruleset). Runs the integration test suite against the compose test DBs (`make test-backend-coverage` — same suite with a coverage profile; the total goes to the job summary and `coverage.out` is uploaded as an artifact), **Lint (golangci-lint)** and **Vulnerability check (govulncheck)** in the same job, then runs the **essential E2E suite** (`make test-backend-e2e` — production router + real JWT middleware). Go 1.26.\n- **`api-perf-smoke` job**: after `test`, boots the self-contained load-test stack (`make loadtest-stack-up`) and runs the k6 `smoke.js` lane (one fresh user, seconds) against the compose API on `:8080`. k6 thresholds (p95, error rate) fail the PR on breach. Heavy load-test lanes run nightly instead — see `nightly-loadtest.yml`.\n- **`build-push` job**: runs **only on `vX.Y.Z` tags** — builds and pushes the backend image to Docker Hub (`*DOCKERHUB_USERNAME*/lifetracker-backend`) tagged `X.Y.Z`, `X.Y` and `latest`, and uploads the per-domain JSON endpoint files from `backend/endpoints/` as an artifact.\n\n## `frontend-ci.yml`\n\n- **`lint` job**: PR gate (unconditional — see Merge ruleset; path-filtered on pushes touching `frontend/**` + `packages/shared/**`) — prettier check, vitest unit tests, **coverage report** (totals to the job summary + html artifact; report-only), `tsc --noEmit`, and a **prod dependency audit** (`node scripts/audit-prod.mjs`).\n- **`e2e` job**: spins up the full-stack container lane (`make dev-container`: postgres + mongodb + api + nginx static export with the `/api` proxy on :3000) and runs the Playwright essential suite (`frontend/e2e/` — auth guard, UI login, notes CRUD, deploy canary). Playwright HTML report uploaded on failure. Essential-only: deeper E2E is follow-up work.\n- **`build-export` job**: runs `next build` with `output: 'export'`, asserting `out/index.html` is produced.\n- **`build-and-push` job**: runs **only on `vX.Y.Z` tags** — builds and pushes the frontend image to Docker Hub (`lautaroblasco1998/lifetracker-frontend`) tagged `X.Y.Z`, `X.Y` and `latest`, then smoke-tests the pushed image.\n- **`smoke` job**: after `build-and-push`, pulls `:latest` (the just-pushed release image) and verifies nginx serving, env injection, deep-link routes (`/notes`, `/finance/`), the `GATEWAY_UPSTREAM` nginx var and the `/api` proxy.\n\n## `mobile-ci.yml`\n\n- PR gate (unconditional on PRs; path-filtered on pushes for `apps/mobile/**` + `packages/shared/**` + `scripts/**` + the workflow file): type-check, jest-expo unit tests, shared package vitest tests, a prod dependency audit (`npm audit`), and expo Android export (bundle build as validation).\n\n## `nightly-loadtest.yml`\n\n- Full k6 suite (smoke → read/write-heavy → auth-storm → mixed-rhythms → features) via root `make loadtest` on a daily cron (`0 3 * * *`), also manual (`workflow_dispatch`). Each k6 script's thresholds gate the run; k6 JSON reports are uploaded as an artifact. Observability streaming disabled (`REMOTE_WRITE=0`).\n\n## `security.yml`\n\n- Secret scan (gitleaks) on every PR and every push to `main` (full history on the first run). `backend/.env.test` throwaway test fixtures are allowlisted in `.gitleaks.toml` — keep real credentials out of them anyway. Not in the required-checks list (advisory), but treat failures as must-fix.\n\n## Repo automation\n\n- **`.github/dependabot.yml`** — weekly updates for npm (root workspaces), gomod (backend), docker and GitHub Actions, with grouped minor/patch bumps.\n- **`.github/CODEOWNERS`** — per-path code owners for review requests.\n\n## `pr-title.yml`\n\n- Validates every PR title against a conventional prefix (`feat:`, `fix:`, `chore:`, …). Required check **\"Conventional title\"** on `main` — release-please computes versions from squash-merged titles (see `release.yml`), so a wrongly-titled PR cannot merge.\n\n## Merge ruleset (`main`)\n\nRepository ruleset on `main`: PRs required (any merge method), branch deletion and force-push blocked, and the following required status checks. Backend/front/mobile CI have **no paths filters on `pull_request`** because the ruleset blocks merges while any required context is unreported:\n\n| Required check | Workflow |\n|---|---|\n| `test`, `api-perf-smoke` | backend-ci.yml |\n| `lint`, `build-export`, `e2e` | frontend-ci.yml |\n| `type-check-and-export` | mobile-ci.yml |\n| `Conventional title` | pr-title.yml |\n\n`Secret scan (gitleaks)` is not required, and `release-please--branches--main` PRs run the exact same required checks (release-please PRs are exempted from nothing).\n\n## `release.yml` — versioning workflow\n\nReleases are **PR-driven** (release-please):\n\n1. Every PR is squash-merged to `main`, so each PR title becomes one conventional commit. PR titles are validated by `pr-title.yml` (`feat:`, `fix:`, `chore:`, … — required).\n2. After each merge to `main`, release-please inspects commits since the last release and opens/updates a **release PR** (`chore(main): release X.Y.Z`) that bumps `package.json` (root, frontend, shared), mobile `app.json` and `CHANGELOG.md` in one commit.\n3. **Merging the release PR** creates the `vX.Y.Z` tag + GitHub Release, which triggers the Docker `build-push`/`build-and-push` jobs in both CI workflows. No other event builds images.\n4. Bump rules: `feat!`/`fix!`/`BREAKING CHANGE` → **major**, `feat` → **minor**, `fix`/`perf` → **patch**, other types → no release.\n5. Highest bump wins if several PRs merge before the release PR is merged (one version absorbs them all, `feat` beats `fix`).\n\nThe app version displayed in the web navbar is injected at build time from `frontend/package.json` (`next.config.mjs` → `NEXT_PUBLIC_APP_VERSION`), so navbar and release versions never drift.\n\n> **Branch-protection note:** release-please commits via `RELEASE_PAT` (configured; falls back to `GITHUB_TOKEN` if unset). A PAT avoids the strict-branch-protection exemption problem — GITHUB_TOKEN-created release PRs can't pass a \"require PRs\" ruleset without an exemption.\n\n## Repository Secrets\n\nThe workflows rely on Docker Hub credentials. Configure these in **Settings → Secrets and variables → Actions** of the `life-tracker` repository:\n\n| Secret | Required by | Purpose |\n|---|---|---|\n| `DOCKERHUB_USERNAME` | backend-ci.yml, frontend-ci.yml | Docker Hub account used in image names and for login |\n| `DOCKERHUB_TOKEN` | backend-ci.yml, frontend-ci.yml | Docker Hub access token for image push authentication |\n| `RELEASE_PAT` | release.yml | PAT used by release-please so created tags trigger the Docker build/push workflows (GITHUB_TOKEN-created tags never trigger other workflows) |\n\n> Note: secrets are per-repository and **do not** transfer from the old separate repos (`life-tracker-backend`, etc.). They must be added manually to this repo."}}</script>
<style>
  /* Warm Minimalism tokens — mirrors theme-colors.ts / styles.md */
  :root {
    --background: #F5F2EA;

    --surface-elevated: #FFFFFF;
    --foreground: #30372F;

    --surface-elevated: #33352C;
    --foreground: #F2EFE6;

  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  }
  code, pre, .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  /* Page header — the app's shared PageHeader pattern: full-width bar,
     border-b, title + description left, controls right. */
  .page-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px;
    background: color-mix(in srgb, var(--background) 88%, transparent);
    backdrop-filter: blur(6px);

  .page-header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  .page-header .controls { display: flex; align-items: center; gap: 8px; }

  button.icon {
    height: 36px; min-width: 36px; padding: 0 10px;

    border: 1px solid var(--border); border-radius: 10px;

    font-size: 13px; cursor: pointer;
  }

  /* Layout: sidebar + content */

    flex: 0 0 220px; position: sticky; top: 69px;

    padding: 20px 0 40px;

  nav.toc .group { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted-foreground); margin: 18px 8px 6px; }

    display: block; padding: 6px 10px; margin: 1px 0;
    border-radius: 8px; color: var(--muted-foreground);

  }
  nav.toc a:hover { background: var(--accent); color: var(--foreground); }
  nav.toc a.active { background: var(--accent); color: var(--primary); font-weight: 600; }

  main { flex: 1; min-width: 0; padding: 28px 0 80px; }
  article { max-width: 46rem; }

  /* Markdown typography */
  article h2 { font-size: 21px; font-weight: 650; margin: 2em 0 .5em; letter-spacing: -0.01em;
    padding-top: .5em; }

  article h2, article h3 { scroll-margin-top: 76px; }
  article p, article li { color: var(--foreground); }
  article a { color: var(--primary); text-underline-offset: 3px; }
  article strong { font-weight: 650; }
  article blockquote {
    margin: 1em 0; padding: 10px 16px;
    border-left: 3px solid var(--secondary);
    background: color-mix(in srgb, var(--secondary) 10%, var(--surface));
    border-radius: 0 8px 8px 0; color: var(--muted-foreground);
  }
  article blockquote p { margin: 0; color: var(--foreground); }
  article code {
    font-size: .875em; background: var(--accent); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 6px;
  }
  article pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; overflow-x: auto;
  }
  article pre code { background: none; border: 0; padding: 0; font-size: 13px; }
  article table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px; }
  article th, article td { border: 1px solid var(--border); padding: 7px 10px; text-align: left;
    vertical-align: top; }
  article th { background: var(--accent); font-weight: 600; }
  article tr:nth-child(even) td { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
  article hr { border: 0; border-top: 1px solid var(--border); margin: 2.5em 0; }
  article ul, article ol { padding-left: 1.4em; }
  article li + li { margin-top: 3px; }
  article h1.page-title { font-size: 28px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
  .page-lead { color: var(--muted-foreground); font-size: 14px; margin: 0 0 1.5em; }
  .page-sep { border-top: 1px solid var(--border); margin: 14px 0 0; padding-top: 14px;
    display: flex; gap: 8px; }
  .page-sep a {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--foreground);
    text-decoration: none; font-size: 13px;
  }
  .page-sep a:hover { background: var(--accent); }

  .mobile-only { display: none; }
  @media (max-width: 860px) {
    nav.toc {
      display: none; position: fixed; inset: 69px 0 0 0; flex: none;
      background: var(--background); padding: 20px; z-index: 9;
      max-height: none;
    }
    nav.toc.open { display: block; }
    .mobile-only { display: inline-flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Life Tracker</h1>
      <p class="desc">Monorepo documentation — web, mobile, backend &amp; infra</p>
    </div>
    <div class="controls">
      <button class="icon mobile-only" id="menu" aria-label="Menu">☰ Menu</button>
      <button class="icon" id="theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="shell">
    <nav class="toc" id="toc" aria-label="Docs"></nav>
    <main><article id="content"></article></main>
  </div>

<script>
(function () {
  'use strict';
  var docs = JSON.parse(document.getElementById('docs-data').textContent);
  var slugs = Object.keys(docs);

  // ---- Theme: same semantics as the web app's ThemeContext ----------------
  // preference in localStorage('theme') is 'system' | 'light' | 'dark'.
  // Storage can be unavailable (sandboxed iframes) — degrade to system theme.
  var KEY = 'theme';
  var store = (function () {
    try { localStorage.setItem(KEY, localStorage.getItem(KEY) || 'system'); return localStorage; }
    catch (e) { return { getItem: function () { return 'system'; }, setItem: function () {} }; }
  })();
  function systemDark() {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
    catch (e) { return false; }
  }
  function apply(pref) {
    var dark = pref === 'dark' || (pref === 'system' && systemDark());
    document.documentElement.classList.toggle('dark', dark);
  }
  function pref() { return store.getItem(KEY) || 'system'; }
  apply(pref());
  var mq = null;
  try {
    mq = window.matchMedia('(prefers-color-scheme: dark)');
  } catch (e) { /* not available */ }
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () {
      apply(pref());
    });
  }
  var themeBtn = document.getElementById('theme');
  var ICONS = { system: '◐', light: '☀', dark: '☾' };
  var LABELS = { system: 'System theme', light: 'Light theme', dark: 'Dark theme' };
  function paintThemeBtn() {
    var p = pref();
    themeBtn.textContent = ICONS[p];
    themeBtn.title = LABELS[p] + ' (click to cycle)';
    themeBtn.setAttribute('aria-label', themeBtn.title);
  }
  themeBtn.addEventListener('click', function () {
    var order = ['system', 'light', 'dark'];
    var next = order[(order.indexOf(pref()) + 1) % order.length];
    store.setItem(KEY, next);
    apply(next);
    paintThemeBtn();
  });
  paintThemeBtn();

  // ---- Sidebar ------------------------------------------------------------
  var toc = document.getElementById('toc');
  var GROUPS = [
    ['Start', ['getting-started', 'architecture']],
    ['Apps', ['frontend', 'mobile']],
    ['Backend', ['backend', 'data-schemas']],
    ['Reference', ['deployment-modes', 'styles', 'tests', 'loadtest', 'ci-cd']],
  ];
  var html = '';
  GROUPS.forEach(function (g) {
    html += '<div class="group">' + g[0] + '</div>';
    g[1].forEach(function (slug) {
      html += '<a href="#/' + slug + '" data-slug="' + slug + '">' + docs[slug].title + '</a>';
    });
  });
  toc.innerHTML = html;

  var menuBtn = document.getElementById('menu');
  menuBtn.addEventListener('click', function () { toc.classList.toggle('open'); });

  // ---- Rendering -----------------------------------------------------------
  marked.setOptions({ gfm: true, breaks: false });

  function slugify(text) {
    return text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function render(slug) {
    var doc = docs[slug];
    var body = marked.parse(doc.md);
    var el = document.getElementById('content');
    el.innerHTML = body;

    // Heading ids for deep links.
    el.querySelectorAll('h2, h3').forEach(function (h) {
      if (!h.id) h.id = slugify(h.textContent);
    });

    // Page title comes from the sidebar title (H1s are stripped at build
    // time), so every page gets a stable h1 regardless of its sections.
    var t = document.createElement('h1');
    t.className = 'page-title';
    t.textContent = doc.title;
    el.insertBefore(t, el.firstChild);

    // Links: cross-doc *.md links navigate inside the viewer; everything
    // else renders as inert code-style text (file:// has no repo context).
    el.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href || href.startsWith('#')) return;
      if (/^https?:\/\//i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var base = href.split('#')[0].split('/').pop().replace(/\.md$/i, '');
      var target = null;
      if (slugs.indexOf(base) !== -1) target = base;
      else if (/\.md$/i.test(href)) {
        // Markdown link to a file that isn't a docs page — degrade to plain text.
        var span = document.createElement('code');
        span.textContent = href.replace(/^\.?\//, '');
        a.replaceWith(span);
        return;
      } else {
        // Non-markdown relative link (e.g. repo paths): inert, shown as code.
        var code = document.createElement('code');
        code.textContent = href.replace(/^\.?\//, '');
        a.replaceWith(code);
        return;
      }
      if (target) {
        a.setAttribute('href', '#/' + target);
        a.removeAttribute('target');
      }
    });

    // Images (diagrams/) sit next to index.html — relative src works as-is.
    // Prev/next footer.
    var idx = slugs.indexOf(slug);
    var sep = document.createElement('div');
    sep.className = 'page-sep';
    var parts = [];
    if (idx > 0) parts.push('<a href="#/' + slugs[idx - 1] + '">← ' + docs[slugs[idx - 1]].title + '</a>');
    if (idx < slugs.length - 1) parts.push('<a href="#/' + slugs[idx + 1] + '">' + docs[slugs[idx + 1]].title + ' →</a>');
    sep.innerHTML = parts.join('');
    el.appendChild(sep);

    // Sidebar + title state.
    document.querySelectorAll('nav.toc a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-slug') === slug);
    });
    toc.classList.remove('open');
    document.title = doc.title + ' — Life Tracker Docs';
  }

  function route() {
    var slug = (location.hash.match(/^#\/(.+)$/) || [])[1];
    if (!slug || slugs.indexOf(slug) === -1) slug = slugs[0];
    render(slug);
    if (location.hash !== '#/' + slug) {
      history.replaceState(null, '', '#/' + slug);
    } else {
      window.scrollTo(0, 0);
    }
    // Honor in-page anchors like #/backend#schema (best effort).
    if (location.hash.indexOf('#', 2) !== -1) {
      var anchor = document.getElementById(location.hash.slice(location.hash.indexOf('#', 2) + 1));
      if (anchor) anchor.scrollIntoView();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
